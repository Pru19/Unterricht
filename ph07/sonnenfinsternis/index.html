<title>Die Sonnenfinsternis</title>
<!--
  Ph07 II Optische Phänomene – Lernadventure, PROTOTYP: Kapitel 1 (Strand, Glashaus, Leuchtturmfuß, Dunkelkammer).
  Planung in "00 Spielplanung.md" (gleicher Ordner). Eine Datei ohne Nachladen.
  Kein Konto, keine Speicherung, keine Übertragung (CLAUDE.md §5b).

  Ablauf
    Strand      Laterne im Boot, Höhle, Glashaus, Leuchtturm (Ende des Prototyps)
    Höhle       R1  Kiste: Was leuchtet von selbst? Laterne an/aus vergleichen
    Glashaus    R3  rote Blüte unter grünem Glas – mit der Laterne weißes Licht
    Werkbank    R4  Punktebild: der Code erscheint durch das Rotglas
                R5  Kristall im Lichtstrahl, Dachklappe auf, Steine ins Licht ihrer Farbe
    Turmfuß     R2  Verschlag von oben: Laterne in einen Spalt, Auge in einen anderen –
                    sichtbar nur, wenn Laterne→Schlüssel und Schlüssel→Auge frei sind
    Dunkelkammer drei Blickrichtungen, man dreht sich mit Pfeilen links und rechts:
                Fensterladen  R7 Schieber: kleines Loch scharf und dunkel, großes hell und unscharf
                Wand          R6 das Bild von draußen, gedreht; Pfeilschloss → Streichhölzer
                Tisch         R8 Lichtbahn: Kerze anzünden, drei Löcher auf die Gerade Flamme–Kristall
  Entdeckungen erscheinen nicht als Karte, sondern still im Forscherheft (Knopf oben rechts).
    Arbeitszimmer Erdgeschoss des Turms, zwischen Tür und Dunkelkammer: Inselkarte, Globus
                (Tag und Nacht), Teleskop. Linse ins Teleskop + alle Rätsel → Codewort, Ende Kapitel 1
  Kapitel 2 (Codewort MONDSCHATTEN oder „Gleich weiterspielen“)
    Arbeitszimmer Hoftür offen; Werklampe in der Werkbank jetzt nehmbar (Verzahnung)
    Schattenhof  drei Blickrichtungen:
                 Hoftor          R9  Laterne ziehen, Schatten der Kugel genau auf die goldenen Steine
                 Schattentheater R10 zwei Lampen, Rot- und Grünglas: oben nur rot, unten nur grün
                 Feuerkorb       R11 ausgedehnte Quelle, Schablone nah an die Mauer → scharfer Schatten
    Sternwarte   über die Luke in der Dunkelkammer (Lukenschlüssel aus R9)
                 Himmelsmaschine R12 vier Mondzeichnungen einstellen (Kurbel aus R10)
                                 R13 Sonnen- und Mondfinsternis (Mondbahn in der Ebene)
                                 R14 Schattenstab (R11): Insel im Halbschatten → Kurbel → Finale
  Farben werden gerechnet: Reflexionsgrad × Licht × Filter (RGB), das Spektrum
  in sechs Bändern.

  Hinweise: Tagebuchseiten in Stufen. Stufe 1 nach ZEIT1 Sekunden im Rätsel oder
  FEHL1 Fehlversuchen, Stufe 2 nach weiteren ZEIT2 Sekunden oder FEHL2
  Fehlversuchen insgesamt, Stufe 3 nur auf Anforderung im Tagebuch.

  Testmodus: Adresse mit #test aufrufen – Sprungknöpfe oben links.
-->
<style>

.karte button { font: inherit; font-size: 19px; padding: 10px 20px; border-radius: 10px; border: 2px solid #7a6a4a;
  background: #3a2e22; color: #f3e6c4; cursor: pointer; }
.karte button.leise { background: transparent; color: #6b5a40; }
.karte.dunkel button.leise { color: #bbb; }

.flug { position: fixed; width: 62px; height: 62px; z-index: 9; pointer-events: none; padding: 3px;

  transition: transform .75s cubic-bezier(.45,-0.25,.6,1); }
.flug svg { width: 100%; height: 100%; }
.ding.neu { animation: plopp .5s ease-out; }
@keyframes plopp { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.flugSeite { position: fixed; left: 0; top: 0; width: 60px; height: 76px; z-index: 9; pointer-events: none;

.flugEntdeckung { position: fixed; left: 0; top: 0; width: 220px; height: 80px; z-index: 9; pointer-events: none;

.heftEintrag p { margin: 2px 0 0; font-size: 17px; line-height: 24px; }

<script>
"use strict";
// ───────────────────────── Einstellungen ─────────────────────────
const ZEIT1 = 240;  // Sekunden im Rätsel bis zur ersten Hinweisseite
const FEHL1 = 4;    // … oder so viele Fehlversuche
const ZEIT2 = 240;  // weitere Sekunden bis zur zweiten Seite
const FEHL2 = 8;    // … oder so viele Fehlversuche insgesamt

// ───────────────────────── Texte ─────────────────────────
const RAETSEL = {
  R1: { name: "Die Kiste in der Höhle",
    s0: "Öffnen kann mich nur, wer weiß, was in dieser Höhle von selbst leuchtet.",
    s: ["Manche Dinge in meiner Höhle sehe ich auch, wenn die Laterne aus ist. Andere sind dann einfach verschwunden.",
        "Laterne aus – und genau hinschauen, was übrig bleibt. Nur das leuchtet wirklich von selbst.",
        "Spiegel, Katzenaugen, Rückstrahler, Perle und mein gemalter Mond glänzen nur, weil sie das Licht der Laterne zurückwerfen. Von selbst leuchten nur das Glühwürmchen, die Glut und der Leuchtpilz."] },
  R3: { name: "Die rote Blüte",
    s0: "Mein Rotglas liegt unter der roten Blüte. Da sucht es keiner.",
    s: ["Seit die Scheiben grün sind, finde ich meine roten Blumen nicht mehr. Dabei stehen sie doch noch da.",
        "Durch grünes Glas kommt nur grünes Licht. Meine rote Blüte wirft aber nur rotes Licht zurück. Was sieht man dann von ihr?",
        "Unter grünem Licht sieht eine rote Blüte schwarz aus. Leuchte die dunklen Blüten mit der Laterne an – ihr Licht ist weiß."] },
  R4: { name: "Der Schrank",
    s0: "Meinen Schrank-Code verstecke ich zwischen bunten Punkten. Mit dem richtigen Glas lese ich ihn sofort.",
    s: ["Durch mein Rotglas sieht weißes Papier rot aus. Und die bunten Punkte?",
        "Punkte mit viel Rot darin lässt das Rotglas durch – sie sehen dann aus wie das Papier. Blaues Licht lässt es nicht durch. Blaue Punkte werden dunkel.",
        "Schau dir den Zettel an und tippe dabei unten auf das Rotglas. Die dunklen Punkte bilden den Code."] },
  R5: { name: "Das Farbschloss",
    s0: "Weißes Licht ist nicht so einfach, wie es aussieht. Mein Kristall zeigt es. Jeder Stein will in das Licht seiner Farbe.",
    s: ["Der Kristall gehört in den Halter unter dem Dachfenster. Aber selbst dann leuchtet am Schloss nur ein einziger Stein. Wo sind die anderen Farben geblieben?",
        "Der Kristall färbt das Licht nicht – er fächert es nur auf. Grünes Licht hat nur Grün in sich. Ich brauche weißes Licht.",
        "Zieh an der Schnur: Die Klappe im Dach geht auf, weißes Licht fällt auf den Kristall. Leg dann jeden Stein in das Licht seiner Farbe."] },
  R2: { name: "Der Verschlag unter der Treppe",
    s0: "Der Turmschlüssel liegt in meinem Verschlag unter der Treppe. Dort ist es so dunkel, dass ich ihn selbst kaum wiederfinde.",
    s: ["Unter der Treppe ist es dunkel, weil kein Licht hinkommt. Genauer hinschauen hilft da nicht.",
        "Ich sehe den Schlüssel erst, wenn Licht auf ihn fällt. Das Licht muss geradlinig von der Laterne bis zu ihm kommen – durch eine Lücke zwischen den Stufen.",
        "Halte die Laterne schräg links oberhalb der Treppe, etwa auf Höhe der Tür, und zieh sie langsam hin und her, bis ein Lichtstreifen zwischen zwei Stufen hindurch hinten auf den Boden fällt."] },
  R7: { name: "Das Bild an der Wand",
    s0: "Durch das Loch in meinem Fensterladen fällt Licht herein, und gegenüber an der Wand erscheint ein Bild von draußen. Nur ist mein Loch zu groß geworden: Das Bild ist hell – aber man erkennt nichts mehr.",
    s: ["Mit dem Schieber am Fensterladen kann ich das Loch größer und kleiner machen. Und meine Laterne lasse ich hier besser aus.",
        "Je kleiner das Loch, desto schärfer das Bild – aber auch dunkler.",
        "Tippe am Schieber das kleinste oder zweitkleinste Loch an und dreh dich zur Wand um. Dann ist das Bild scharf."] },
  R6: { name: "Die vier Pfeile",
    s0: "Im Schattenhof habe ich vier Pfeile an die Mauer gemalt. Stell sie am Schloss ein – so, wie sie draußen in Wirklichkeit aussehen.",
    zeit1: 120,   // der Baum-Hinweis kommt hier früher: nach 2 Minuten
    s: ["Seltsam: Der Baum im Bild an der Wand wächst nach unten. Und meine Farben stehen in der falschen Reihenfolge.",
        "Licht läuft geradlinig durch das Loch. Was draußen oben ist, landet unten an der Wand – und was links ist, landet rechts.",
        "Im Bild zeigt jeder Pfeil genau in die Gegenrichtung. Stell jeden Farbpfeil am Schloss umgekehrt ein: Zeigt der rote im Bild nach unten, zeigt er draußen nach oben."] },
  R8: { name: "Die Lichtbahn",
    s0: "Meine Kerze, drei Wände mit Loch und hinten der Kristall. Trifft ihn das Licht, gibt er die Linse frei.",
    s: ["Alle Löcher auf gleicher Höhe – und trotzdem trifft das Licht die Wand über dem Kristall.",
        "Licht läuft geradlinig von der Flamme zum Kristall. Alle drei Löcher müssen auf genau dieser Linie liegen.",
        "Der Kristall liegt tiefer als die Flamme. Also: erstes Loch etwas tiefer, zweites noch tiefer, drittes am tiefsten – alle auf der geraden Linie von der Flamme zum Kristall."] },
  R9: { name: "Das Hoftor",
    s0: "Meine Klappe in der Mauer hat zwei Riegel. Für jeden müssen genau die goldenen Steine im Schatten meiner Kugel liegen – erst viele, dann wenige.",
    s: ["Je näher ich die Laterne an die Kugel halte, desto größer wird ihr Schatten.",
        "Licht läuft geradlinig an der Kugel vorbei. Die beiden Randstrahlen begrenzen den Schatten an der Mauer.",
        "Für den großen Schatten: Laterne nah an die Kugel. Für den kleinen: weit nach links. Mit der Höhe der Laterne schiebst du den Schatten nach oben oder unten."] },
  R10: { name: "Das Schattentheater",
    s0: "Mein Schattenschloss: Oben soll nur rotes Licht hinscheinen, unten nur grünes – und in die Mitte gar kein Licht.",
    s: ["Zwei Lampen machen zwei Schatten. Wohin nur eine Lampe scheint, hat der Schatten ihre Farbe.",
        "Eine Lampe weit oben wirft ihren Schatten nach unten. Eine Lampe weit unten wirft ihn nach oben.",
        "Rotglas vor die eine Lampe, Grünglas vor die andere. Schieb die rote etwas über die Mitte und die grüne etwas unter die Mitte – bis sich beide Schatten in der Mitte überdecken."] },
  R11: { name: "Der Feuerkorb",
    s0: "Mein Schlüssel-Schloss öffnet nur, wenn der Schatten meiner Schablone den gemalten Umriss an der Mauer genau und scharf ausfüllt.",
    s: ["Ein Feuer ist keine kleine Lampe. Sein Licht kommt von vielen Stellen zugleich – darum wird der Schattenrand weich.",
        "Weit weg von der Mauer ist der Schatten groß und verschwommen. Nah an der Mauer wird er kleiner und schärfer.",
        "Schieb den Wagen mit der Schablone ganz nach rechts, dicht an die Mauer."] },
  R12: { name: "Die vier Monde",
    s0: "Vier Monde habe ich gezeichnet. Tippe eine Zeichnung an und stell den Mond so, dass er von der Erde aus genauso aussieht.",
    s: ["Die Sonne beleuchtet immer die Hälfte des Mondes, die zu ihr zeigt.",
        "Steht der Mond zwischen Erde und Sonne, sehen wir nur seine dunkle Seite. Steht er hinter der Erde, sehen wir die ganze helle Seite.",
        "Für einen Halbmond steht der Mond seitlich neben der Erde – ein Viertel der Runde von der Sonne weg. Eine schmale Sichel liegt nah an der Sonnenseite."] },
  R13: { name: "Die zwei Finsternisse",
    s0: "Eine Sonnenfinsternis und eine Mondfinsternis: Stell an meiner Tafel ein, wie es dazu kommt. Das Fenster zeigt, was man von meiner Insel aus sieht.",
    s: ["Bei jeder Finsternis wirft ein Himmelskörper seinen Schatten auf einen anderen.",
        "Wer wirft den Schatten? Bei der Sonnenfinsternis der Mond auf die Erde, bei der Mondfinsternis die Erde auf den Mond.",
        "Sonnenfinsternis: Mond zwischen Sonne und Erde, so dass der schwarze Kernschatten genau auf meine Insel fällt. Mondfinsternis: Mond hinter die Erde, mitten in ihren Schatten."] },
  R14: { name: "Morgen um zehn",
    s0: "Ich habe ausgerechnet, wo der Mond morgen um zehn Uhr steht – die Messingmarke auf meiner Tafel. Stell den Mond dorthin. Wird es bei uns ganz dunkel?",
    s: ["Im Kernschatten des Mondes wäre die Sonne ganz verdeckt. Dann würde es mitten am Tag fast so dunkel wie in der Nacht.",
        "Wo nur ein Teil der Sonne verdeckt ist, wird es nur ein wenig dunkler. Das ist der Halbschatten.",
        "Schieb den Mond genau auf die Messingmarke und schau ins Fenster: Die Sonne ist nur zum Teil verdeckt – meine Insel liegt im Halbschatten."] },
  R15: { name: "Sicher beobachten",
    s0: "Schau nie direkt in die Sonne – auch nicht durch ein Farbglas! Ich schaue sie mir nur als Bild an. Überlege, wo ich dafür Möglichkeiten habe. Geh zu einem dieser Orte und tippe dort an, wo die Sonne als Bild erscheint.",
    zeit1: 120,   // der konkrete Hinweis auf Dunkelkammer und Arbeitszimmer kommt nach 2 Minuten
    s: ["In meiner Dunkelkammer und in meinem Arbeitszimmer kann ich die Sonne als Bild anschauen.",
        "In der Dunkelkammer fällt das Licht durch das kleine Loch an die Wand. Mein Teleskop im Arbeitszimmer wirft das Sonnenbild auf einen Karton.",
        "Geh in die Dunkelkammer, dreh dich zur Wand und tippe das Bild an. Oder geh ins Arbeitszimmer und tippe das Teleskop an."] }
};
// Kleinigkeiten zum Entdecken – nur Kulisse, keine Tagebucheinträge
const KLEIN = {
  netz: "Ein Spinnennetz mit Tautropfen. Sie glitzern grün.", thermometer: "Ein Thermometer. Am Abend wird es frisch.",
  kanne: "Eine Gießkanne. Leer.", schere: "Eine Gartenschere.",
  lupe: "Eine Lupe. Alles wird groß – nur nicht klarer.", tasse: "Kalter Tee. Lina war lange nicht mehr hier.", scherben: "Eine Kiste mit Glasscherben. Nichts davon ist ganz.",
  regal: "Bücher über Licht, Farben, Sterne und den Mond.",
  tonne: "Eine Regentonne. Im Wasser spiegelt sich der dunkle Himmel.", schild: "„Leuchtturm – Privat“",
  kittel: "Linas Arbeitskittel. Die Taschen sind leer.", buch: "„Über Licht und Schatten“. Eine Seite hat ein Eselsohr.",
  skizze: "Linas Skizzenbuch: Blumen, Wolken, Sterne.", brief: "Der Briefkasten ist leer.",
  foto: "Eine alte Fotoplatte vom Schattenhof.", kalender: "Linas Mondkalender. Um morgen hat sie einen dicken Kreis gemalt: Neumond – Sonnenfinsternis!",

function rgb(c) { return "rgb(" + c.map(v => Math.round(255 * Math.pow(Math.min(1, Math.max(0, v)), 1 / 1.45))).join(",") + ")"; }
function mal(refl, licht, filter) { return rgb(refl.map((r, i) => r * licht[i] * (filter ? filter[i] : 1))); }

function mischRGB(baender) {   // Strahlfarbe aus Bandstärken
  const s = [0, 0, 0]; baender.forEach((b, i) => BAND_RGB[i].forEach((v, k) => s[k] += b * v));

}

function leuchtturm(cx, yb, k = 1) {
  const h = 260 * k, wb = 30 * k, wt = 20 * k, yt = yb - h; let s = "";
  for (let i = 0; i < 6; i++) {
    const y0 = yb - h * i / 6, y1 = yb - h * (i + 1) / 6, w0 = wb - (wb - wt) * i / 6, w1 = wb - (wb - wt) * (i + 1) / 6;
    s += `<polygon points="${cx - w0},${y0} ${cx + w0},${y0} ${cx + w1},${y1} ${cx - w1},${y1}" fill="${i % 2 ? "#6e3a48" : "#9a93ad"}"/>`;
  }
  s += `<polygon points="${cx - wb},${yb} ${cx + wb},${yb} ${cx + wt},${yt} ${cx - wt},${yt}" fill="url(#texStein)" opacity=".5" style="mix-blend-mode:multiply"/>
   <polygon points="${cx - wb},${yb} ${cx - wb * 0.3},${yb} ${cx - wt * 0.3},${yt} ${cx - wt},${yt}" fill="#000" opacity=".28"/><polygon points="${cx + wb * 0.6},${yb} ${cx + wb},${yb} ${cx + wt},${yt} ${cx + wt * 0.6},${yt}" fill="#000" opacity=".4"/>`;
  s += `<rect x="${cx - 34 * k}" y="${yt - 8 * k}" width="${68 * k}" height="${9 * k}" fill="#2a2638"/>
   <rect x="${cx - 21 * k}" y="${yt - 48 * k}" width="${42 * k}" height="${40 * k}" fill="#2a2f4a" stroke="#1a1826" stroke-width="${3 * k}"/>
   <path d="M${cx - 21 * k} ${yt - 48 * k} q${21 * k} ${-34 * k} ${42 * k} 0z" fill="#1f1b2c"/>
   <rect x="${cx - 8 * k}" y="${yb - 40 * k}" width="${16 * k}" height="${40 * k}" fill="#1f1b2c"/>`;
  return s;
}

let PUNKTE = null;
function punkteBauen() {
  const W = 640, H = 440, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d"); g.fillStyle = "#000"; g.font = "bold 300px Georgia, serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("3815", W / 2, H / 2 + 10);

  const A = [[0.12, 0.25, 0.9], [0.2, 0.15, 0.82], [0.1, 0.4, 0.85], [0.28, 0.2, 0.9]];
  const B = [[0.85, 0.15, 0.72], [0.6, 0.38, 0.95], [0.95, 0.35, 0.38], [0.7, 0.22, 0.9], [0.9, 0.55, 0.75]];

    if (px < 0 || py < 0 || px >= W || py >= H) continue;
