<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Unfallgutachter</title>
<!--
  Ph09 I/04 Arbeit – Lernspiel, Prototyp: Fall 1 „Die Bremsspur“, Fall 2 „Die Abkürzung“,
  Fall 3 „Der Schubs“.
  Entwurf in 00 Spielplanung.md, Abschnitt 6. Eine Datei ohne Nachladen.
  Keine Anmeldung, keine Speicherung, keine Übertragung (CLAUDE.md §5b).

  Ablauf
    Büro
    Unfallstelle   Spurenkoffer: Werkzeug selbst wählen, Spur frei vermessen
    Teststrecke A  nachgebauter E-Scooter: Stimmt die Aussage? Bei welchem Tempo passt die Spur?
    Teststrecke B  „Gutachter rechnen“: ΔE/s (als Bruch) ausrechnen → konstant →
                   gleich der Bremskraft → mit zweiter Bremse prüfen → ΔE = F · s bauen
    Benennung (ΔE heißt Arbeit W), Werkzeug, Gutachten (im Büro), Ergebnis
  Fall 3 (nach Fall 2 oder mit dem Fallcode RAMPE)
    Schulhof        Spurenkoffer: Video, Kraftmesser, Waage …
    Video           erstes und letztes Bild des Schubses suchen, Schubstrecke an den Fugen
    Auswertung      zugeführt? → E vorher, E nachher → W = ΔE = E_nachher − E_vorher (positiv)
    Rückblick       Bremse: kinetische Energie erhöht? → W = 0 − E_vorher (negativ)
    Übersicht       Schubs und Bremse nebeneinander → Werkzeug Energieänderung
    Gutachten       W, F = W / s, Vergleich mit der behaupteten Kraft, Urteil
  Fall 2 (nach Fall 1 oder mit dem Fallcode BREMSE)
    Vor der Schule  Spurenkoffer: Verleih-App, Waage, Höhenmesser …
    Auswertung      W = F · s für beide Wege → gleich → was spart der lange Weg? →
                    gemeinsam ist Δh → ΔE_h → W = m · g · Δh bauen
    Gutachten       Teil 1: Akku vorher − nachher, beweist das die Rampe?
                    Teil 2: die Motorkraft verrät den Weg
  Leitlinie: höchstens ein Satz je Bildschirm.
-->
<style>
:root { --gruen: #3BA34B; --gelb: #FFC000; --rot: #D9534F; --blau: #2E75B6; --papier: #FFF8E7; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #1f2d3a; color: #222; font: 18px/1.35 Carlito, Calibri, "Segoe UI", system-ui, sans-serif; }
#spiel { max-width: 1100px; margin: 0 auto; position: relative; }
#heim { position: absolute; left: 10px; bottom: 12px; width: 54px; height: 54px; border-radius: 14px; border: 3px solid #fff; background: #3d566e; color: #fff; font-size: 1.6rem; padding: 0; z-index: 2; }
#kopf { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #2b3d4f; color: #fff; flex-wrap: wrap; }
#kopf .rang { background: var(--gelb); color: #222; font-weight: bold; padding: 3px 12px; border-radius: 20px; }
#kopf .stempel { display: flex; gap: 4px; }
#kopf .st { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #E05050; color: #E05050; font-weight: bold;
            font-size: 12px; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); }
#kopf .st.weg { opacity: .2; }
#kopf .beweise { display: flex; gap: 6px; }
#kopf .bw { background: #fff; color: #222; border-radius: 6px; padding: 1px 8px; font-size: .85rem; font-weight: bold; }
#kopf .werkzeug { margin-left: auto; display: flex; gap: 6px; align-items: center; }
#kopf .karte { background: #fff; color: #222; border-radius: 6px; padding: 2px 8px; font-size: .85rem; font-weight: bold; }
#kopf .sterne { color: var(--gelb); font-weight: bold; }
#buehne { position: relative; background: #cfe6f5; }
#buehne svg.szene { display: block; width: 100%; height: auto; }
#leiste { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 10px 76px; background: #2b3d4f; min-height: 78px; }
#leiste:empty { display: none; }
#spielende { position: absolute; right: 10px; bottom: 12px; height: 54px; border-radius: 14px; border: 3px solid #fff; background: #3d566e; color: #fff; font: inherit; font-weight: bold; font-size: .95rem; line-height: 1.1; padding: 0 10px; z-index: 2; display: none; }
#spiel.fahrt #spielende { display: block; }
#spiel.fahrt #leiste { padding-right: 120px; }
button { font: inherit; cursor: pointer; }
.k { padding: 10px 20px; border-radius: 14px; border: 3px solid #fff; background: var(--gruen); color: #fff; font-weight: bold; font-size: 1.1rem; }
.k.hell { background: #fff; color: #2b3d4f; }
.k.an { background: var(--gelb); color: #222; }
.k:disabled { opacity: .4; cursor: default; }
.werkz { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; border-radius: 14px; border: 3px solid #fff;
         background: #3d566e; color: #fff; font-weight: bold; font-size: .85rem; min-width: 86px; }
.werkz b { font-size: 1.6rem; }
.werkz.an { background: var(--gelb); color: #222; }
.werkz.benutzt { border-color: var(--gelb); }
.seg { display: flex; border: 3px solid #fff; border-radius: 14px; overflow: hidden; }
.seg button { padding: 9px 14px; border: 0; background: #3d566e; color: #fff; font-weight: bold; }
.seg button.an { background: var(--gelb); color: #222; }
.seg button:disabled { opacity: .4; }
.lbl { color: #fff; font-size: .85rem; text-align: center; }
.feldgruppe { display: flex; flex-direction: column; align-items: center; gap: 3px; }
input[type=range] { width: 260px; accent-color: var(--gelb); }
.tempo { color: #fff; font-weight: bold; font-size: 1.3rem; min-width: 5.2em; text-align: center; }
.ebene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2%; background: rgba(20,30,40,.25); }
.blatt { background: var(--papier); border-radius: 14px; padding: 16px 20px; box-shadow: 0 8px 30px rgba(0,0,0,.35);
         max-height: 100%; overflow: auto; width: 100%; max-width: 820px; }
.blatt h2 { margin: 0 0 8px; font-size: 1.4rem; }
.mitte { text-align: center; }
.knoepfe { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
/* Messtabelle auf der Teststrecke */
#tafel { position: absolute; right: 1.5%; top: 25%; background: #fff; border-radius: 10px; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
         font-size: .85rem; max-width: 46%; }
#tafel table { border-collapse: collapse; }
#tafel th, #tafel td { border: 1px solid #ddd; padding: 2px 7px; text-align: center; font-variant-numeric: tabular-nums; }
#tafel th { background: #f2f2f2; }
#tafel th.q, #tafel td.q { background: #FFF2CC; }
#tafel input { width: 4.6em; font: inherit; text-align: right; border: 2px solid #bbb; border-radius: 5px; padding: 1px 3px; }
#tafel input.gut { border-color: var(--gruen); background: #DFF2D8; }
#tafel input.schlecht { border-color: var(--rot); background: #F8D7D5; }
#tafel tr.neu td { background: #EAF4FF; }
/* Formel bauen */
.formel { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 12px 0; }
.slot { width: 64px; height: 64px; border: 3px dashed #9a8f73; border-radius: 12px; display: flex; align-items: center; justify-content: center;
        font: italic bold 1.7rem "Cambria Math", Cambria, serif; background: #fff; }
.slot.voll { border-style: solid; border-color: var(--blau); }
.ziel { font: italic bold 1.6rem "Cambria Math", Cambria, serif; }
.bausteine { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.stein { width: 60px; height: 60px; border-radius: 12px; border: 3px solid var(--blau); background: #DEEBF7; font: italic bold 1.6rem "Cambria Math", Cambria, serif; }
.stein.op { border-color: #7F7F7F; background: #eee; font-style: normal; }
.bruch { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.05;
         font: italic bold 1em "Cambria Math", Cambria, serif; margin: 0 2px; }
.bruch.einheit { font: bold .8em Carlito, Calibri, sans-serif; }
.bruch > span:first-child { border-bottom: 2px solid currentColor; padding: 0 3px; }
.hinweis { text-align: center; font: 1.05rem Carlito, Calibri, sans-serif; color: #555; margin-top: 12px; min-height: 1.3em; }
.gutachten label { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 1.1rem; }
.gutachten input { font: inherit; width: 7em; padding: 6px 8px; border: 2px solid #9a8f73; border-radius: 8px; text-align: right; }
.tippk { border: 2px solid #E0B400; background: #FFF2CC; border-radius: 50%; width: 38px; height: 38px; font-size: 1.1rem; padding: 0; }
.tippf { background: #FFF2CC; border-radius: 8px; padding: 3px 10px; font: 1.05rem Carlito, Calibri, sans-serif; }
.tippf i { font-family: "Cambria Math", Cambria, serif; }
.tippf { white-space: nowrap; }
.wurzel { white-space: nowrap; font-size: 1.15em; }
.radikand { display: inline-block; border-top: 2px solid currentColor; padding: 2px 3px 0; margin-left: -1px; font-size: .87em; }
.tippf small, .gutachten label small { font: .8rem Carlito, Calibri, sans-serif; color: #555; margin-left: 6px; }
.gutachten input.gut { border-color: var(--gruen); background: #DFF2D8; color: #222; }
.gutachten input.falsch { border-color: var(--rot); background: #F8D7D5; }
.akte { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 6px 0 10px; }
.akte > span { background: #fff; border: 2px solid #c9c2ae; border-radius: 10px; padding: 4px 10px; font-weight: bold; }
.werkzeugkarte { display: inline-block; background: #fff; border: 3px solid var(--gelb); border-radius: 12px; padding: 10px 18px; font: italic bold 1.6rem "Cambria Math", Cambria, serif; }
.code { font-size: 1.3rem; font-weight: bold; letter-spacing: .15em; border: 3px dashed var(--gelb); border-radius: 10px; padding: 1px 10px; color: var(--gelb); }
.messung { border-collapse: collapse; margin: 8px auto; font-size: 1.1rem; }
.messung th, .messung td { border: 1px solid #c9c2ae; padding: 4px 12px; text-align: center; font-variant-numeric: tabular-nums; }
.messung th { background: #f2ead6; }
.messung input { font: inherit; width: 5.5em; padding: 3px 6px; border: 2px solid #9a8f73; border-radius: 6px; text-align: right; }
.messung input.gut, .gutachten input.gut { border-color: var(--gruen); background: #DFF2D8; color: #222; }
.messung input.falsch { border-color: var(--rot); background: #F8D7D5; }
.fazit { text-align: center; font-weight: bold; color: #2f7a2f; margin: 4px 0; }
/* die Kernaussage eines Falls – schwarz auf Gelb wie die Hinweise auf der Bühne */
.fazit.kern { color: #222; background: var(--gelb); border-radius: 8px; padding: 4px 12px; display: table; margin: 6px auto; }
.protokoll { display: inline-block; background: #fff; border: 3px solid #555; border-radius: 10px; padding: 8px 18px; font-size: 1.3rem; font-weight: bold; }
.buchknopf { background: #fff; color: #222; border: 0; border-radius: 6px; padding: 2px 10px; font-weight: bold; font-size: .95rem; }
.buch { background: repeating-linear-gradient(#fffdf5 0, #fffdf5 29px, #cfe0f3 30px); border-left: 4px double #E08080;
        padding: 4px 14px 8px 22px; line-height: 30px; font-size: 1.05rem; }
.buch h3 { margin: 0; line-height: 30px; color: var(--blau); }
.buch ul { margin: 0 0 6px; padding-left: 18px; }
.buch .f { font-family: "Cambria Math", Cambria, serif; font-style: italic; font-weight: bold; white-space: nowrap; }
.buch .neu { background: #FFF2CC; }
.buch .f sub { font: normal .75em Carlito, Calibri, sans-serif; }
.ix { font: normal .6em Carlito, Calibri, sans-serif; }
.vz { display: inline-block; min-width: 1.1em; border-bottom: 3px solid #555; text-align: center; margin-right: 2px; }
#leiste.eng { flex-wrap: nowrap; gap: 8px; }
#leiste.eng .k { padding: 8px 12px; font-size: 1rem; }
#leiste.eng input[type=range] { width: 170px; }
.steuer { padding: 16px 30px; font-size: 1.3rem; user-select: none; -webkit-user-select: none; touch-action: none; }
/* schmale Bildschirme (Tablet hochkant): Fenster kompakter, damit nichts gescrollt werden muss */
@media (max-width: 900px) { .blatt { padding: 10px 14px; } .blatt h2 { font-size: 1.15rem; } .blatt ul { font-size: .88rem !important; line-height: 1.3 !important; } .blatt .k { padding: 7px 14px; font-size: 1rem; } }
.wackeln { animation: wackeln .4s; }
@keyframes wackeln { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>
<body>
<div id="spiel">
  <div id="kopf"></div>
  <div id="buehne"></div>
  <div id="leiste"></div>
  <button id="heim" title="Zur Startseite">🏠</button>
  <button id="spielende">🏆 Spiel<br>beenden</button>
</div>

<script>
'use strict';

// ================================================================ Grundlagen

const bruchHTML = (o, u, groesse = false) => `<span class="bruch${groesse ? '' : ' einheit'}"><span>${o}</span><span>${u}</span></span>`;
const BRUCH = bruchHTML('Δ<i>E</i>', '<i>s</i>', true), KMH = bruchHTML('km', 'h'), MS = bruchHTML('m', 's');
const kopf = document.getElementById('kopf');
const buehne = document.getElementById('buehne');
const leiste = document.getElementById('leiste');

// ohne Tausenderpunkt: „2.845 J“ läse sich wie ein Komma
const z = (x, st = 0) => x.toLocaleString('de-DE', { minimumFractionDigits: st, maximumFractionDigits: st, useGrouping: false });
function lies(t) {
  t = String(t).trim().replace(/\s/g, '').replace(/[−–]/g, '-').replace(/^\+/, '');
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : NaN;
}
const passt = (x, soll, tol = 0.05) => !isNaN(x) && Math.abs(x - soll) <= Math.abs(soll) * tol;
const kmh = v => v / 3.6;
/* Passt eine Testspur zur Unfallspur? Relativ, damit benachbarte Tempos auch bei
   kurzen Spuren unterscheidbar bleiben (11 und 12 km/h liegen dort nur 0,25 m auseinander). */
const spurPasst = (s, ziel) => Math.abs(s - ziel) <= Math.max(0.1, 0.08 * ziel);
const wackle = el => { el.classList.remove('wackeln'); void el.offsetWidth; el.classList.add('wackeln'); };

const stand = { rang: 'Praktikant', stempel: 3, werkzeuge: [], sterne: 0, beweise: {}, buch: new Set() };

function kopfZeigen() {
  const b = stand.beweise;
  kopf.innerHTML = `<span class="rang">${stand.rang}</span>
    <span class="stempel">${[0, 1, 2].map(i => `<span class="st${i < stand.stempel ? '' : ' weg'}">OK</span>`).join('')}</span>
    <span class="sterne">${'★'.repeat(stand.sterne)}</span>
    <span class="beweise">${b.spur != null ? `<span class="bw">📏 ${z(b.spur, 1)} m</span>` : ''}${b.masse ? `<span class="bw">⚖ ${b.masse} kg</span>` : ''}${b.kraft ? `<span class="bw">🛑 ${b.kraft} N</span>` : ''}${b.hoehe ? `<span class="bw">📐 Δ<i>h</i> = ${b.hoehe} m</span>` : ''}${b.app ? '<span class="bw">📱 App</span>' : ''}${b.akku ? `<span class="bw">🔋 ${z(b.akku[0])} → ${z(b.akku[1])} J</span>` : ''}${b.kraftBeh ? `<span class="bw">💬 „höchstens ${b.kraftBeh} N“</span>` : ''}${b.video ? `<span class="bw">📹 ${z(b.video.vv * 3.6, 1)} ${KMH} → ${z(b.video.vn * 3.6, 1)} ${KMH}</span><span class="bw">📏 ${z(b.video.s, 1)} m</span>` : ''}</span>
    <span class="werkzeug">🧰 ${stand.werkzeuge.map(w => `<span class="karte">${w}</span>`).join('') || '<span style="opacity:.6">leer</span>'}
      ${stand.buch.size ? '<button class="buchknopf" id="buchK" title="Notizbuch">📓 Notizbuch</button>' : ''}</span>`;
  const k = document.getElementById('buchK');
  if (k) k.onclick = () => buchZeigen();
}

/* Die Unfallstelle: bei jedem Start neu gezogen. In etwa jedem dritten Fall stimmt die Aussage. */
function neuerFall() {
  const behauptet = [12, 15, 18][Math.floor(Math.random() * 3)];
  const ehrlich = Math.random() < 0.34;
  const wirklich = ehrlich ? behauptet - 1 - Math.floor(Math.random() * 3) : behauptet + 4 + Math.floor(Math.random() * 5);
  const F = [250, 300][Math.floor(Math.random() * 2)];
  const m = 85;
  const spur = 0.5 * m * kmh(wirklich) ** 2 / F;
  return { behauptet, wirklich, F, m, spur, ehrlich, vB: Math.round(kmh(behauptet) * 10) / 10, F2: 400 };
}
let fall = neuerFall();

// ================================================================ Zeichnen

const SVG = inhalt => `<svg class="szene" viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg">${inhalt}</svg>`;
const SCHRIFT = 'font-family="Carlito, Calibri, sans-serif"';

function person(x, y, { haut = '#F2C49B', oberteil = '#2E75B6', hose = '#2b3a67', helm = null, haare = '#5a3a22', s = 1, arm = 0 } = {}) {
  return `<g transform="translate(${x},${y}) scale(${s})">
    <line x1="-7" y1="-40" x2="-10" y2="0" stroke="${hose}" stroke-width="9" stroke-linecap="round"/>
    <line x1="7" y1="-40" x2="10" y2="0" stroke="${hose}" stroke-width="9" stroke-linecap="round"/>
    <rect x="-16" y="-88" width="32" height="52" rx="10" fill="${oberteil}"/>
    <line x1="14" y1="-80" x2="${24 + arm * 6}" y2="${-54 - arm * 30}" stroke="${haut}" stroke-width="8" stroke-linecap="round"/>
    <line x1="-14" y1="-80" x2="-22" y2="-50" stroke="${haut}" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-104" r="17" fill="${haut}"/>
    ${helm ? `<path d="M-19 -106 A19 19 0 0 1 19 -106 Z" fill="${helm}"/>` : `<path d="M-17 -108 A17 17 0 0 1 17 -108 L14 -112 L-14 -112 Z" fill="${haare}"/>`}
    <circle cx="6" cy="-105" r="2" fill="#222"/><path d="M2 -96 Q6 -93 10 -96" stroke="#222" stroke-width="2" fill="none"/>
  </g>`;
}
/* Textbreite in der Schrift, die das Gerät wirklich hat – fehlt Carlito, wird die
   Blase breiter, statt dass der Text über den Rand läuft */
const messer = document.createElement('canvas').getContext('2d');
function textbreite(t, groesse = 22) {
  messer.font = `bold ${groesse}px Carlito, Calibri, sans-serif`;
  return messer.measureText(t).width;
}
function blase(x, y, text, breite = 330, rechts = false) {
  // mehrere Zeilen mit '\n' – sonst wird eine lange Blase breiter als die Bühne
  const zeilen = text.split('\n'), h = 24 + 30 * zeilen.length;
  const noetig = Math.max(...zeilen.map(z => zeilenBreite(z, 22))) + 48;
  if (noetig > breite) { if (rechts) x -= noetig - breite; breite = noetig; }
  const sx = rechts ? x + breite - 40 : x + 40;      // Mitte des Ansatzes der Spitze
  const spitze = `${sx - 20},${y + h} ${rechts ? sx + 20 : sx - 20},${y + h + 22} ${sx + 20},${y + h}`;
  return `<g><rect x="${x}" y="${y}" width="${breite}" height="${h}" rx="18" fill="#fff" stroke="#222" stroke-width="3"/>
    <polygon points="${spitze}" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
    <rect x="${sx - 17}" y="${y + h - 3}" width="34" height="5" fill="#fff"/>
    ${zeilen.map((z, i) => zeile(z, y + 35 + 30 * i, 22, '#222', x + breite / 2)).join('')}</g>`;
}
/* Eine Textzeile mit echten Brüchen: {E/s} kursiv als Größen, {km/h} und {m/s}
   aufrecht als Einheiten – Zähler über Nenner mit Bruchstrich. */
const BRUCH_MARKE = /\{([^{}/]+)\/([^{}/]+)\}/;
function zeilenTeile(text) {
  const teile = [];
  let rest = text, m;
  while ((m = rest.match(BRUCH_MARKE))) {
    teile.push(rest.slice(0, m.index), { o: m[1], u: m[2] });
    rest = rest.slice(m.index + m[0].length);
  }
  teile.push(rest);
  return teile;
}
function bruchBreite(b, groesse) { return Math.max(textbreite(b.o, groesse * 0.8), textbreite(b.u, groesse * 0.8)) + 8; }
function zeilenBreite(text, groesse) {
  return zeilenTeile(text).reduce((w, t) => w + (typeof t === 'string' ? textbreite(t, groesse) : bruchBreite(t, groesse) + 6), 0);
}
function zeile(text, y, groesse, farbe, cx = 480) {
  let x = cx - zeilenBreite(text, groesse) / 2, svg = '';
  for (const t of zeilenTeile(text)) {
    if (typeof t === 'string') {
      svg += `<text x="${x}" y="${y}" font-size="${groesse}" font-weight="bold" fill="${farbe}" ${SCHRIFT} xml:space="preserve">${t}</text>`;
      x += textbreite(t, groesse);
      continue;
    }
    const bb = bruchBreite(t, groesse), m = x + 3 + bb / 2;
    const groesse2 = /E/.test(t.o) ? 'font-family="Cambria Math, Cambria, serif" font-style="italic" font-weight="bold"' : `font-weight="bold" ${SCHRIFT}`;
    svg += `<text x="${m}" y="${y - groesse * 0.45}" text-anchor="middle" font-size="${groesse * 0.8}" fill="${farbe}" ${groesse2}>${t.o}</text>
      <line x1="${m - bb / 2}" y1="${y - groesse * 0.32}" x2="${m + bb / 2}" y2="${y - groesse * 0.32}" stroke="${farbe}" stroke-width="2"/>
      <text x="${m}" y="${y + groesse * 0.38}" text-anchor="middle" font-size="${groesse * 0.8}" fill="${farbe}" ${groesse2}>${t.u}</text>`;
    x += bb + 6;
  }
  return svg;
}
function titel(t, unter, unter2) {
  return `<rect x="0" y="0" width="960" height="${unter2 ? 112 : unter ? 84 : 52}" fill="rgba(31,45,58,.85)"/>
    <text x="480" y="36" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff" ${SCHRIFT}>${t}</text>
    ${unter ? zeile(unter, 70, 20, '#FFC000') : ''}
    ${unter2 ? zeile(unter2, 100, 20, '#fff') : ''}`;
}
function scooter(x, y, { gekippt = false, dummy = false } = {}) {
  return `<g transform="translate(${x},${y}) ${gekippt ? 'rotate(-80)' : ''}">
    <line x1="-48" y1="-8" x2="34" y2="-8" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <line x1="30" y1="-8" x2="42" y2="-78" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="32" y1="-78" x2="54" y2="-80" stroke="#222" stroke-width="6" stroke-linecap="round"/>

    <circle cx="-44" cy="0" r="4" fill="#888"/><circle cx="34" cy="0" r="4" fill="#888"/>
    ${dummy ? `<g transform="translate(-6,-12)"><rect x="-10" y="-46" width="20" height="40" rx="6" fill="#FFC000"/>
      <circle cx="0" cy="-58" r="12" fill="#FFC000" stroke="#222" stroke-width="2"/><path d="M-6 -58 h12 M0 -64 v12" stroke="#222" stroke-width="2"/>
      <line x1="6" y1="-40" x2="44" y2="-66" stroke="#FFC000" stroke-width="7" stroke-linecap="round"/>

  </g>`;
}
/* SVG-Koordinaten eines Klicks */
function svgPunkt(svg, e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function ebene(html, breite = 560) {
  const e = document.createElement('div');
  e.className = 'ebene';
  e.innerHTML = `<div class="blatt" style="max-width:${breite}px">${html}</div>`;
  buehne.append(e);
  return e;
}

function bueroZeigen() {
  fall = neuerFall();
  stand.stempel = 3; stand.beweise = {}; stand.aufgerollt = false; stand.extraStern = false;

/* Das Notizbuch des Gutachters: nach jedem Fall eine Seite mit dem, was er
   gezeigt hat. Nach Fall 3 wird es ganz gezeigt und aufs Arbeitsblatt (AB09)
   übertragen. Formeln mit Δ, wie im Spiel. */
const F_ = t => `<span class="f">${t}</span>`;
const BUCH = [
  { titel: 'Fall 1: Die Bremsspur', zeilen: [
    'Die Energie, die durch die Einwirkung einer Kraft <i>F</i> entlang eines Weges Δ<i>s</i> einem System zugeführt oder entzogen wird, heißt <b>Arbeit <i>W</i></b>. Man sagt: Die Arbeit wird „verrichtet“.',
    `${F_('W = ΔE')} &nbsp;und&nbsp; ${F_('W = F · Δs')} &nbsp; (Arbeit = Kraft · Weg)`] },
  { titel: 'Fall 2: Die Abkürzung', zeilen: [
    `Wird ein Körper um Δ<i>h</i> angehoben, gilt für die Hubarbeit: ${F_('W = m · g · Δh')} – genau die Zunahme der Höhenenergie.`,
    'Die Hubarbeit hängt nicht vom Weg ab: Ein flacher Weg spart Kraft, ist dafür länger.',
    'Hinweis: Kraft ist nicht Energie – die Arbeit (= Energieänderung) ist auf beiden Wegen gleich, die Kraft verschieden.'] },
  { titel: 'Fall 3: Der Schubs', zeilen: [
    `Energieänderung: ${F_('W = ΔE = E<sub>nachher</sub> − E<sub>vorher</sub>')}`,
    'Kraft <b>in</b> Fahrtrichtung: Dem System wird von außen Energie zugeführt, <i>W</i> ist positiv.',
    'Kraft <b>gegen</b> die Fahrtrichtung: Das System gibt nach außen Energie ab, <i>W</i> ist negativ.'] },
];
function buchZeigen(neu = 0, abschluss = false) {
  const seiten = BUCH.map((s, i) => [s, i + 1]).filter(([, n]) => stand.buch.has(n));
  const e = ebene(`<h2 class="mitte" style="margin-bottom:4px">${neu && !abschluss ? '📓 Neuer Eintrag im Notizbuch' : '📓 Notizbuch des Gutachters'}</h2>
    ${abschluss ? '<p class="mitte" style="margin:0 0 8px;font-weight:bold">Übertrage dein Notizbuch auf das Arbeitsblatt AB09.</p>' : ''}
    <div class="buch">${seiten.map(([s, n]) => `<h3>${s.titel}</h3><ul class="${n === neu && !abschluss ? 'neu' : ''}">${s.zeilen.map(z => `<li>${z}</li>`).join('')}</ul>`).join('')}</div>
    <div class="knoepfe"><button class="k" id="zu">${abschluss ? 'Fertig ✔' : 'Schließen'}</button></div>`, 760);
  e.querySelector('#zu').onclick = () => e.remove();
  // ein neuer Eintrag steht unten – dorthin scrollen
  if (neu && !abschluss) e.querySelector('.buch ul:last-child').scrollIntoView({ block: 'end' });
}
function eintragen(n, abschluss = false) {
  stand.buch.add(n);
  kopfZeigen();
  buchZeigen(n, abschluss);
}

/* Startseite: jeder Fall ist einzeln startbar, sobald er frei ist. Frei wird er
   durch den Fall davor oder durch seinen Code – gespeichert wird nichts. */
const FAELLE = [
  { name: 'Die Bremsspur', code: null, rang: 'Praktikant', werkzeuge: [], start: () => bueroZeigen() },
  { name: 'Die Abkürzung', code: 'BREMSE', rang: 'Gutachter', werkzeuge: ['Arbeit'], start: () => fall2Buero() },
  { name: 'Der Schubs', code: 'RAMPE', rang: 'Fachgutachter', werkzeuge: ['Arbeit', 'Hubarbeit'], start: () => fall3Buero() },
  { name: 'Beweisfahrt (Üben)', code: 'SCHUBS', rang: 'Chefgutachter', werkzeuge: ['Arbeit', 'Hubarbeit', 'Energieänderung'], start: () => beweisfahrtStart(), schild: 'FAHRT' },
];
stand.frei = 1;
let lauf = 0;                         // zählt hoch, sobald die Startseite kommt – alte Zeitgeber laufen dann ins Leere
const spaeter = (fn, ms) => { const l = lauf; setTimeout(() => { if (l === lauf) fn(); }, ms); };
function fallStarten(n) {
  const F = FAELLE[n - 1];
  for (let i = 1; i < n; i++) stand.buch.add(i);      // wer mit Code einsteigt, hat die Fälle davor schon gespielt
  stand.rang = F.rang; stand.werkzeuge = [...F.werkzeuge];
  F.start();
}
/* Alle Akten liegen auf dem Tisch. Fall 1 ist immer offen, die anderen nach dem
   Fall davor – oder mit ihrem Code. */
function startZeigen() {
  lauf++; endeKnopf(false); T.faehrt = false; leiste.classList.remove('eng'); document.onkeydown = document.onkeyup = null;
  stand.beweise = {}; stand.stempel = 3;
  kopfZeigen();
  bueroSzene(null, null);
  const svg = buehne.querySelector('svg');
  // die Akten auf dem Tisch, die Fahrt zum Gericht als Tür rechts
  const fahrtNr = FAELLE.findIndex(F => F.schild) + 1, fahrtOffen = fahrtNr <= stand.frei;
  svg.insertAdjacentHTML('beforeend', FAELLE.map((F, i) => {
    if (F.schild) return '';
    const x = 330 + i * 115, offen = i < stand.frei;
    return `<g data-n="${i + 1}" style="cursor:pointer" transform="rotate(${[-4, 2, -2][i]} ${x + 50} 285)">
      <rect x="${x}" y="262" width="100" height="44" rx="4" fill="${offen ? '#E0B46A' : '#C9B48E'}" stroke="#8a6a2a" stroke-width="3"/>
      <text x="${x + 50}" y="290" text-anchor="middle" font-size="17" font-weight="bold" ${SCHRIFT}>${offen ? '' : '🔒 '}AKTE ${i + 1}</text></g>`;
  }).join('') + `<g data-n="${fahrtNr}" style="cursor:pointer">
      <rect x="872" y="150" width="80" height="210" fill="#8a5a2a" stroke="#5a3a1a" stroke-width="4"/>
      <circle cx="886" cy="262" r="5" fill="#FFC000"/>
      <polygon points="700,282 920,282 950,307 920,332 700,332" fill="${fahrtOffen ? '#3BA34B' : '#8a9a8a'}" stroke="#fff" stroke-width="3"/>
      <text x="812" y="314" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff" ${SCHRIFT}>${fahrtOffen ? '' : '🔒 '}Fahrt zum Gericht</text></g>`
    + blase(560, 130, 'Willkommen! Tippe auf eine Akte.', 300));
  svg.querySelectorAll('[data-n]').forEach(g => g.onclick = () => { const n = +g.dataset.n; if (n <= stand.frei) fallStarten(n); else fallcode(n); });
  leiste.innerHTML = '';
}
document.getElementById('heim').onclick = () => {
  if (buehne.querySelector('#heimfrage')) return;
  const e = ebene(`<div class="mitte" id="heimfrage"><h2>Zur Startseite? Der Fall beginnt dann von vorn.</h2>
    <div class="knoepfe"><button class="k" id="ja">🏠 Zur Startseite</button><button class="k hell" id="nein">Weiterspielen</button></div></div>`, 520);
  e.querySelector('#ja').onclick = startZeigen;
  e.querySelector('#nein').onclick = () => e.remove();
};
/* Ohne Speicherung geht es nach dem Neuladen nur mit dem Code weiter */
function fallcode(n) {
  const e = ebene(`<div class="mitte"><h2>🔑 Code für ${FAELLE[n - 1].schild ? 'die Fahrt zum Gericht' : `Fall ${n}`}</h2>
    <input id="c" autocomplete="off" style="font:inherit;font-size:1.3rem;width:9em;text-align:center;text-transform:uppercase;padding:6px;border:2px solid #9a8f73;border-radius:8px">
    <div class="knoepfe"><button class="k" id="ok">Öffnen</button><button class="k hell" id="zu">Zurück</button></div></div>`, 420);
  const c = e.querySelector('#c');
  c.focus();
  e.querySelector('#zu').onclick = () => e.remove();
  e.querySelector('#ok').onclick = () => {
    if (c.value.trim().toUpperCase() !== FAELLE[n - 1].code) { wackle(c); return; }
    stand.frei = Math.max(stand.frei, n);
    fallStarten(n);
  };
  c.onkeydown = ev => { if (ev.key === 'Enter') e.querySelector('#ok').click(); };
}

// ================================================================ 2 Unfallstelle

const SP = 70;                        // Pixel je Meter auf Unfallstelle und Teststrecke
const SPUR_X = 120, SPUR_Y = 378;

function unfallstelleZeigen() {
  kopfZeigen();
  const x1 = SPUR_X + fall.spur * SP;
  buehne.innerHTML = SVG(`
    <rect width="960" height="470" fill="#cfe6f5"/>
    <rect x="0" y="250" width="960" height="40" fill="#8bbf6a"/>
    <rect x="0" y="290" width="960" height="130" fill="#6d6d6d"/>
    ${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect x="${i * 130 + 20}" y="352" width="70" height="6" fill="#eee"/>`).join('')}
    <rect x="0" y="420" width="960" height="50" fill="#bdb6a5"/>
    <defs><linearGradient id="spurg" x1="0" x2="1"><stop offset="0" stop-color="#1a1a1a" stop-opacity=".25"/><stop offset=".15" stop-color="#1a1a1a" stop-opacity=".85"/><stop offset="1" stop-color="#1a1a1a" stop-opacity=".9"/></linearGradient></defs>
    <rect x="${SPUR_X}" y="${SPUR_Y - 6}" width="${x1 - SPUR_X}" height="10" rx="4" fill="url(#spurg)"/>
    <rect x="${SPUR_X}" y="${SPUR_Y + 10}" width="${x1 - SPUR_X}" height="6" rx="3" fill="url(#spurg)" opacity=".6"/>
    ${scooter(x1 + 50, SPUR_Y + 18, { gekippt: true })}
    ${[0, 1, 2, 3, 4, 5].map(i => `<rect x="${i * 160}" y="236" width="80" height="10" fill="#E05050"/><rect x="${i * 160 + 80}" y="236" width="80" height="10" fill="#fff"/>`).join('')}
    ${person(850, 290, { helm: '#2E75B6', oberteil: '#3BA34B', s: 1.2, arm: 1 })}
    ${titel('🚨 Unfall mit dem E-Scooter', 'Untersuche den Unfall: Stimmt die Aussage?')}
    ${blase(500, 92, `Ich war höchstens ${fall.behauptet} {km/h} schnell!`, 400, true)}
    <g id="mass"></g><g id="info"></g>
  `);
  const svg = buehne.querySelector('svg');
  const info = svg.querySelector('#info'), mass = svg.querySelector('#mass');
  const zeigeInfo = t => { info.innerHTML = `<rect x="160" y="424" width="640" height="40" rx="12" fill="#FFC000"/>
    ${zeile(t, 451, 21, '#222')}`; };

  // Spurenkoffer: das richtige Werkzeug wählt die Klasse selbst
  const WERKZEUGE = [
    { id: 'band', zeichen: '📏', name: 'Maßband' },
    { id: 'waage', zeichen: '⚖', name: 'Waage' },
    { id: 'bremse', zeichen: '🛑', name: 'Bremsprüfer' },
    { id: 'uhr', zeichen: '⏱', name: 'Stoppuhr' },
    { id: 'thermo', zeichen: '🌡', name: 'Thermometer' },
    { id: 'kamera', zeichen: '📷', name: 'Kamera' },
  ];
  leiste.innerHTML = `${WERKZEUGE.map(w => `<button class="werkz" data-w="${w.id}"><b>${w.zeichen}</b>${w.name}</button>`).join('')}
    <button class="k" id="weiter">Zur Polizei ➜</button>`;
  let messen = null;
  const knopf = id => leiste.querySelector(`[data-w="${id}"]`);
  leiste.querySelectorAll('.werkz').forEach(b => b.onclick = () => {
    leiste.querySelectorAll('.werkz').forEach(x => x.classList.remove('an'));
    messen = null;
    const w = b.dataset.w;
    if (w === 'band') { b.classList.add('an'); messen = []; mass.innerHTML = ''; zeigeInfo('Tippe auf Anfang und Ende der Spur.'); return; }
    b.classList.add('benutzt');
    if (w === 'waage') { stand.beweise.masse = fall.m; zeigeInfo(`Fahrer mit E-Scooter: ${fall.m} kg`); }
    if (w === 'bremse') { stand.beweise.kraft = fall.F; zeigeInfo(`Bremskraft: ${fall.F} N`); }
    if (w === 'uhr') zeigeInfo('Der Unfall ist vorbei – hier läuft nichts mehr.');
    if (w === 'thermo') zeigeInfo('Asphalt 14 °C – hilft das weiter?');
    if (w === 'kamera') zeigeInfo('Foto gemacht. Für Zahlen brauchst du ein Messgerät.');
    kopfZeigen();
  });
  svg.addEventListener('click', e => {
    if (!messen) return;
    const p = svgPunkt(svg, e);
    if (p.y < 300 || p.y > 420) { zeigeInfo('Tippe direkt auf die Spur.'); return; }
    messen.push(p.x);
    mass.innerHTML = messen.map(x => `<circle cx="${x}" cy="${SPUR_Y}" r="9" fill="#FFC000" stroke="#222" stroke-width="2"/>`).join('');
    if (messen.length < 2) return;
    const [a, b] = messen.sort((u, v) => u - v);
    // Wer die Spur ungefähr trifft, liest am Maßband die Spurlänge ab – auf 0,1 m.
    // So bleibt der Messwert nah genug an der Wahrheit, dass die Testfahrten
    // später eindeutig zu einem Tempo passen.
    const laenge = (b - a) / SP;
    const getroffen = Math.abs(laenge - fall.spur) <= Math.max(0.2, 0.12 * fall.spur);
    const anzeige = getroffen ? Math.round(fall.spur * 10) / 10 : laenge;
    mass.innerHTML += `<line x1="${a}" y1="${SPUR_Y - 20}" x2="${b}" y2="${SPUR_Y - 20}" stroke="#FFC000" stroke-width="10"/>
      <rect x="${(a + b) / 2 - 50}" y="${SPUR_Y - 66}" width="100" height="34" rx="8" fill="#FFC000"/>
      <text x="${(a + b) / 2}" y="${SPUR_Y - 42}" text-anchor="middle" font-size="22" font-weight="bold">${z(anzeige, 1)} m</text>`;
    messen = null;
    knopf('band').classList.remove('an');
    if (getroffen) {
      stand.beweise.spur = anzeige;
      knopf('band').classList.add('benutzt');
      zeigeInfo(`Spur: ${z(stand.beweise.spur, 1)} m`);
      kopfZeigen();
    } else zeigeInfo('Das ist nicht die ganze Spur. Miss noch einmal.');
  });
  document.getElementById('weiter').onclick = () => {
    const b = stand.beweise;
    if (b.spur == null || !b.masse || !b.kraft) { zeigeInfo('Für einen Nachbau fehlen der Polizei noch Daten.'); wackle(document.getElementById('weiter')); return; }
    uebergangPolizei();
  };
}

function uebergangPolizei() {
  const e = ebene(`<div class="mitte"><div style="font-size:3rem">🚓</div>
    <h2>Die Polizei baut den E-Scooter nach und testet, ob die Aussage zur Bremsspur passt.</h2>
    <div class="knoepfe"><button class="k" id="ok">Zur Teststrecke ➜</button></div></div>`);
  e.querySelector('#ok').onclick = () => teststrecke('A');
}

// ================================================================ 3 Teststrecke

/* Phase A: ausprobieren und schätzen. Phase B: die Rechnung entwickeln.
   Phase B läuft in Schritten; ein Schritt nennt immer genau eine Aufgabe. */
const XB = 120;                                   // Bremsbeginn
const T = { phase: 'A', schritt: 'A1', tempo: 10, bremse: 0, fahrten: [], faehrt: false };

function teststrecke(phase) {
  T.phase = phase;
  if (phase === 'A') { T.schritt = 'A1'; T.fahrtenA = []; }
  if (phase === 'B') { T.schritt = 'B1'; T.fahrten = []; T.bremse = 0; }
  kopfZeigen();
  buehne.innerHTML = SVG(`
    <rect width="960" height="470" fill="#d7ecf7"/>
    <rect x="0" y="330" width="960" height="140" fill="#8a8a8a"/>
    <rect x="0" y="326" width="960" height="6" fill="#fff"/>
    ${Array.from({ length: 12 }, (_, k) => `<line x1="${XB + k * SP}" y1="332" x2="${XB + k * SP}" y2="350" stroke="#fff" stroke-width="3"/>
      <text x="${XB + k * SP}" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">${k} m</text>`).join('')}
    <rect x="${XB - 3}" y="250" width="6" height="80" fill="#3BA34B"/>
    <text x="${XB}" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b08">Bremsbeginn</text>
    ${phase === 'A' ? `<rect x="${XB}" y="398" width="${stand.beweise.spur * SP}" height="10" rx="4" fill="#E05050" opacity=".8"/>
      <text x="${XB + stand.beweise.spur * SP + 8}" y="408" font-size="15" font-weight="bold" fill="#fff">Unfallspur</text>` : ''}
    <g id="spur"></g><g id="roller">${scooter(-80, 326, { dummy: true })}</g>
    <g id="geraete" transform="translate(20,150)"></g>
    <g id="aufgabe"></g><g id="info"></g>
  `);
  geraete('–', '–', '–');
  aufgabe();
  leisteTeststrecke();
  tafel();
}
function aufgabeText() {
  return {
    A1: `Stimmt „höchstens ${fall.behauptet} {km/h}“ bei ${z(stand.beweise.spur, 1)} m Unfallspur?`,
    A2: 'Bei welchem Tempo entsteht die Unfallspur?',
    B1: 'Wie ändert sich die Spurlänge, wenn du doppelt so schnell fährst?',
    B2: 'Berechne {ΔE/s} für jede Fahrt und runde auf ganze Zahlen.',
    B4: 'Prüfe es mit der neuen Bremse.',
    B5: 'Berechne wieder {ΔE/s} und runde auf ganze Zahlen.',
  }[T.schritt] || '';
}
function aufgabe() {
  const g = buehne.querySelector('#aufgabe');
  if (!g) return;
  if (T.phase === 'A') {
    const frage = `Stimmt „höchstens ${fall.behauptet} {km/h}“ bei ${z(stand.beweise.spur, 1)} m Unfallspur?`;
    g.innerHTML = titel('🚓 Polizei-Teststrecke · Nachbau', frage, T.schritt === 'A2' ? '➜ Bei welchem Tempo entsteht die Unfallspur?' : '');
  } else g.innerHTML = titel('🧮 Polizei-Teststrecke · Rechnung', aufgabeText());
}
function info(t, farbe = '#FFC000') {
  const g = buehne.querySelector('#info');
  if (!g) return;
  const breite = t ? Math.max(300, zeilenBreite(t, 22) + 48) : 0;
  g.innerHTML = t ? `<rect x="${480 - breite / 2}" y="410" width="${breite}" height="44" rx="12" fill="${farbe}"/>
    ${zeile(t, 440, 22, farbe === '#FFC000' ? '#222' : '#fff')}` : '';
}
function geraete(E, F, s) {
  const g = buehne.querySelector('#geraete');
  const kasten = (x, name, zeichen, wert, farbe) => `<g transform="translate(${x},0)"><rect width="150" height="70" rx="12" fill="#fff" stroke="${farbe}" stroke-width="4"/>
    <text x="10" y="22" font-size="13" fill="#555" ${SCHRIFT}>${name}</text>
    <text x="10" y="56" font-size="26" font-weight="bold" font-style="italic" font-family="Cambria Math, Cambria, serif">${zeichen}</text>
    <text x="142" y="56" text-anchor="end" font-size="22" font-weight="bold" ${SCHRIFT}>${wert}</text></g>`;
  g.innerHTML = kasten(0, 'Energiezähler', 'E<tspan font-size="15" dy="5">kin</tspan>', E, '#FFC000')
    + kasten(162, 'Kraftmesser Bremse', 'F', F, '#D9534F') + kasten(324, 'Spurlänge', 's', s, '#2E75B6');
}
const bremsen = () => [fall.F, fall.F2];
const masse = () => fall.m;

function leisteTeststrecke() {
  const B = T.phase === 'B';
  const neueBremseFrei = B && ['B4', 'B5', 'B6'].includes(T.schritt);
  leiste.innerHTML = `
    <div class="feldgruppe"><input type="range" id="regler" min="5" max="25" step="1" value="${T.tempo}"><span class="lbl">Tempo</span></div>
    <span class="tempo" id="tempo">${T.tempo} ${KMH}</span>
    ${B ? `<div class="feldgruppe"><div class="seg" id="bremse">
      <button data-b="0" class="${T.bremse === 0 ? 'an' : ''}">alte ${fall.F} N</button>
      <button data-b="1" class="${T.bremse === 1 ? 'an' : ''}" ${neueBremseFrei ? '' : 'disabled'}>${neueBremseFrei ? '' : '🔒 '}neue ${fall.F2} N</button></div><span class="lbl">Bremse</span></div>` : ''}
    <button class="k" id="fahren">🛴 Vollbremsung</button>
    ${T.phase === 'A' && T.schritt === 'A1' ? `<button class="k hell" id="urteil" ${T.fahrtenA.length ? '' : 'disabled'}>⚖ Urteilen</button>` : ''}
    ${T.phase === 'A' && T.schritt === 'A2' ? `<button class="k hell" id="spurPasst" ${T.fahrtenA.length ? '' : 'disabled'}>🎯 Tempo bestimmen</button>` : ''}
    ${B && T.schritt === 'B1' ? `<button class="k hell" id="antwort" ${T.fahrten.length >= 2 ? '' : 'disabled'}>💡 Antworten</button>` : ''}`;
  if (document.getElementById('antwort')) document.getElementById('antwort').onclick = antwortVerdopplung;
  if (document.getElementById('urteil')) document.getElementById('urteil').onclick = urteilA;
  if (document.getElementById('spurPasst')) document.getElementById('spurPasst').onclick = tempoBestimmen;
  const regler = document.getElementById('regler');
  regler.oninput = () => { T.tempo = +regler.value; document.getElementById('tempo').innerHTML = `${T.tempo} ${KMH}`; };
  leiste.querySelectorAll('#bremse button').forEach(b => b.onclick = () => { T.bremse = +b.dataset.b; leisteTeststrecke(); });
  document.getElementById('fahren').onclick = () => fahre(T.tempo, T.phase === 'A' ? fall.F : bremsen()[T.bremse]);
}

function fahre(vKmh, F) {
  if (T.faehrt) return;
  T.faehrt = true; info('');
  leiste.querySelectorAll('button, input').forEach(b => b.disabled = true);
  // E wird ganzzahlig angezeigt; die Spur gehört zu genau diesem E, damit E/s in
  // der Tabelle auf die ganze Zahl genau die Bremskraft ergibt
  const m = masse(), v = kmh(vKmh), E = Math.round(0.5 * m * v * v), s = E / F, a = F / m;
  const roller = buehne.querySelector('#roller'), spur = buehne.querySelector('#spur');
  spur.innerHTML = '';
  geraete(`${z(E)} J`, '–', '–');
  const anlauf = 1.4, tB = v / a, start = performance.now(), meinLauf = lauf;
  function tick(jetzt) {
    if (meinLauf !== lauf) return;              // zur Startseite gewechselt
    const t = (jetzt - start) / 1000;
    let x, fertig = false;
    if (t < anlauf) x = XB - (anlauf - t) * v * SP;
    else {
      const tt = Math.min(t - anlauf, tB), weg = v * tt - a * tt * tt / 2;
      x = XB + weg * SP;
      geraete(`${z(E)} J`, `${F} N`, `${z(weg, 2)} m`);
      spur.innerHTML = `<line x1="${XB}" y1="330" x2="${x}" y2="330" stroke="#1a1a1a" stroke-width="7" opacity=".85"/>`;
      if (tt >= tB) fertig = true;
    }
    roller.innerHTML = scooter(x, 326, { dummy: true });
    if (!fertig) return requestAnimationFrame(tick);
    T.faehrt = false;
    // in der Rechnung auf Millimeter, damit E/s nicht durch Rundung von F abweicht
    geraete(`${z(E)} J`, `${F} N`, `${z(s, T.phase === 'B' ? 3 : 2)} m`);
    leisteTeststrecke();
    nachFahrt({ v: vKmh, F, E, s: Math.round(s * 1000) / 1000 });
  }
  requestAnimationFrame(tick);
}

function nachFahrt(f) {
  if (T.phase === 'A') {
    // die Spuren vergleichen die Schülerinnen und Schüler selbst – das Spiel sagt nichts dazu
    if (!T.fahrtenA.some(x => x.v === f.v)) T.fahrtenA.push(f);
    T.fahrtenA.sort((a, b) => a.v - b.v);
    tafel(); leisteTeststrecke();
    return;
  }
  // Phase B
  T.fahrten.push({ ...f, neu: true });
  tafel();
  if (T.schritt === 'B1') leisteTeststrecke();
  if (T.schritt === 'B4' && f.F === fall.F2) {
    const n = T.fahrten.filter(x => x.F === fall.F2).length;
    if (n >= 2) { T.schritt = 'B5'; aufgabe(); tafel(); pruefeQuotienten(); }
    else info('Noch eine Fahrt mit der neuen Bremse.');
  }
}

/* A1: Ein Urteil braucht einen Beweis. Zwei Fahrten taugen dazu: die mit dem
   behaupteten Tempo (dann werden die Spuren verglichen) oder die mit der
   Unfallspur (dann werden die Tempos verglichen). Ein falsches Urteil kostet
   Glaubwürdigkeit, Raten lohnt sich also nicht. */
function fahrtKnoepfe(liste) {
  return liste.map((f, i) => `<button class="k hell" data-i="${i}">${f.v} ${KMH} → ${z(f.s, 2)} m</button>`).join('');
}
function urteilA() {
  const e = ebene(`<div class="mitte"><h2>Welche Fahrt ist dein Beweis?</h2>
    <div class="knoepfe">${fahrtKnoepfe(T.fahrtenA)}</div><div class="mitte" id="hw" style="min-height:24px;font-weight:bold"></div>
    <div class="knoepfe"><button class="k hell" id="zu" style="opacity:.7">Noch eine Fahrt</button></div></div>`, 700);
  e.querySelector('#zu').onclick = () => e.remove();
  e.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const beweis = T.fahrtenA[+b.dataset.i], spur = stand.beweise.spur;
    const gleichesTempo = beweis.v === fall.behauptet, gleicheSpur = !gleichesTempo && spurPasst(beweis.s, spur);
    if (!gleichesTempo && !gleicheSpur) {
      b.disabled = true; wackle(b);
      e.querySelector('#hw').innerHTML = `Diese Fahrt sagt nichts über ${z(spur, 1)} m Bremsspur bei höchstens ${fall.behauptet} ${KMH}.`;
      return;
    }
    T.tempoGefunden = gleicheSpur ? beweis.v : null;
    const vergleich = gleichesTempo
      ? `${beweis.v} ${KMH} → ${z(beweis.s, 2)} m. Unfallspur: ${z(spur, 1)} m.`
      : `${z(beweis.s, 2)} m Spur → ${beweis.v} ${KMH}. Behauptet: höchstens ${fall.behauptet} ${KMH}.`;
    e.querySelector('.blatt').innerHTML = `<div class="mitte"><h2>${vergleich}<br>Stimmt „höchstens ${fall.behauptet} ${KMH}“?</h2>
      <div class="knoepfe"><button class="k" data-j="1" style="background:#2E75B6">👍 stimmt</button><button class="k" data-j="0" style="background:#D9534F">👎 stimmt nicht</button></div></div>`;
    // die Begründung der Polizei – erst nach dem Urteil, nie vorher
    const langsamer = fall.ehrlich;
    const grund = gleichesTempo
      ? `Bei ${beweis.v} ${KMH} wäre die Spur ${z(beweis.s, 2)} m lang. Die Unfallspur ist ${langsamer ? 'kürzer' : 'länger'} – er war also ${langsamer ? 'langsamer' : 'schneller'}.`
      : `Die Unfallspur passt zu ${beweis.v} ${KMH} – das ist ${langsamer ? 'nicht mehr' : 'mehr'} als ${fall.behauptet} ${KMH}.`;
    e.querySelectorAll('[data-j]').forEach(k => k.onclick = () => {
      const richtig = (k.dataset.j === '1') === fall.ehrlich;
      if (!richtig) { stand.stempel--; kopfZeigen(); }
      e.querySelector('.blatt').innerHTML = `<div class="mitte">
        <h2 style="color:${richtig ? '#2f7a2f' : '#C0392B'}">${richtig ? '✔ Richtig geurteilt.' : '✘ Falsch geurteilt – ein Stempel weg.'}</h2>
        <p style="font-size:1.2rem;font-weight:bold">Die Aussage „höchstens ${fall.behauptet} ${KMH}“ ${fall.ehrlich ? 'stimmt' : 'stimmt nicht'}.</p>
        <p style="font-size:1.15rem">${grund}</p>
        <div class="knoepfe"><button class="k" id="weiter">Weiter ➜</button></div></div>`;
      e.querySelector('#weiter').onclick = () => {
        e.remove();
        if (stand.stempel <= 0) { neuAufrollen(); return; }
        // Wer die Unfallspur als Beweis nahm, kennt das Tempo schon – A2 entfällt
        if (T.tempoGefunden) { uebergangRechnung(); return; }
        T.schritt = 'A2'; aufgabe(); leisteTeststrecke();
      };
    });
  });
}

/* A2: das wirkliche Tempo schätzen – die Klasse wählt die passende Fahrt aus */
function tempoBestimmen() {
  const e = ebene(`<div class="mitte"><h2>Welche Fahrt passt zur Unfallspur von ${z(stand.beweise.spur, 1)} m?</h2>
    <div class="knoepfe">${fahrtKnoepfe(T.fahrtenA)}</div>
    <div class="knoepfe"><button class="k hell" id="zu" style="opacity:.7">Noch eine Fahrt</button></div></div>`, 700);
  e.querySelector('#zu').onclick = () => e.remove();
  e.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const f = T.fahrtenA[+b.dataset.i];
    if (!spurPasst(f.s, stand.beweise.spur)) { b.disabled = true; wackle(b); return; }
    e.remove();
    info(`Er war etwa ${f.v} {km/h} schnell.`, '#3BA34B');
    leiste.querySelectorAll('button, input').forEach(x => x.disabled = true);

}

function uebergangRechnung() {
  const e = ebene(`<div class="mitte"><div style="font-size:3rem">⚖️</div>
    <h2>Gutachter bauen nicht jeden Unfall nach – sie rechnen. Dafür brauchst du eine Regel.</h2>
    <div class="knoepfe"><button class="k" id="ok">Rechnung entwickeln ➜</button></div></div>`);
  e.querySelector('#ok').onclick = () => { e.remove(); teststrecke('B'); };
}

/* B1: Die Klasse wählt die Tempos selbst. Antworten kann sie erst, wenn in der
   Tabelle zwei Fahrten stehen, von denen eine doppelt so schnell war. */
function antwortVerdopplung() {
  const alte = T.fahrten.filter(f => f.F === fall.F);
  const paar = alte.some(a => alte.some(b => b.v === 2 * a.v));
  if (!paar) { info('Dafür brauchst du eine Fahrt, die genau doppelt so schnell war.'); return; }
  frage('Doppelt so schnell – die Spur wird …', ['gleich lang', 'doppelt so lang', 'viermal so lang'], 2, () =>
    frage('Und die Energie Δ<i>E</i>, die er dabei abgibt?', ['bleibt gleich', 'doppelt so groß', 'viermal so groß'], 2, () => {
      T.schritt = 'B2'; aufgabe(); tafel(); leisteTeststrecke();
    }));
}

/* Messtabelle mit der Spalte E/s, die die Klasse selbst ausrechnet */
function tafel() {
  let el = document.getElementById('tafel');
  if (!el) { el = document.createElement('div'); el.id = 'tafel'; buehne.append(el); }
  if (T.phase === 'A') {
    el.innerHTML = `<table><tr><th>v in ${KMH}</th><th>s in m</th></tr>
      ${T.fahrtenA.map(f => `<tr><td>${f.v}</td><td>${z(f.s, 2)}</td></tr>`).join('') || '<tr><td colspan="2" style="color:#999">Fahrten</td></tr>'}</table>`;
    return;
  }
  const mitQ = ['B2', 'B3', 'B4', 'B5', 'B6'].includes(T.schritt);
  el.innerHTML = `<table><tr><th>v in ${KMH}</th><th>F in N</th><th>Δ<i>E</i> in J</th><th>s in m</th>${mitQ ? `<th class="q">${BRUCH}</th>` : ''}</tr>
    ${T.fahrten.map((f, i) => [f, i]).sort((a, b) => a[0].F - b[0].F).map(([f, i], k, alle) =>
      (k && alle[k - 1][0].F !== f.F ? `<tr><td colspan="5" style="background:#eee;font-size:.75rem">neue Bremse</td></tr>` : '') +
      `<tr class="${f.neu ? 'neu' : ''}"><td>${f.v}</td><td>${f.F}</td><td>${z(f.E)}</td><td>${z(f.s, 3)}</td>
      ${mitQ ? `<td class="q"><input data-i="${i}" inputmode="decimal" value="${f.q ?? ''}" class="${f.q != null ? 'gut' : ''}" ${f.q != null ? 'disabled' : ''}></td>` : ''}</tr>`).join('')}
    ${T.fahrten.length ? '' : '<tr><td colspan="4" style="color:#999">Messtabelle</td></tr>'}</table>`;
  T.fahrten.forEach(f => f.neu = false);
  el.querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const f = T.fahrten[+inp.dataset.i];
    const x = lies(inp.value);
    if (passt(x, f.E / f.s, 0.03)) { f.q = Math.round(x); inp.className = 'gut'; inp.disabled = true; pruefeQuotienten(); }
    else { inp.className = 'schlecht'; wackle(inp); }
  });
}
function pruefeQuotienten() {
  const alte = T.fahrten.filter(f => f.F === fall.F), neue = T.fahrten.filter(f => f.F === fall.F2);
  if (T.schritt === 'B2' && alte.every(f => f.q != null)) { T.schritt = 'B3'; spaeter(frageKonstant, 500); }
  if (T.schritt === 'B5' && neue.length && neue.every(f => f.q != null)) { T.schritt = 'B6'; spaeter(() => {
    info(`Wieder die Bremskraft: ${fall.F2} N!`, '#3BA34B'); spaeter(formelBauen, 1600); }, 400); }
}

/* B3: zwei Fragen zur Auswertung – falsche Antworten kosten nichts, sie wackeln nur */
function frage(titelText, optionen, richtig, weiter) {
  const e = ebene(`<div class="mitte"><h2>${titelText}</h2><div class="knoepfe">
    ${optionen.map((o, i) => `<button class="k hell" data-i="${i}">${o}</button>`).join('')}</div></div>`, 620);
  e.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (+b.dataset.i === richtig) { e.remove(); weiter(); } else { b.disabled = true; wackle(b); }
  });
}
function frageKonstant() {
  frage(`Was fällt dir an ${BRUCH} auf?`, ['wird größer', 'ist immer gleich', 'wird kleiner'], 1, () => {
    // das Fazit erst, wenn die Klasse es selbst gesehen hat
    info('Spur und Energie wachsen im gleichen Maß.', '#3BA34B');
    frage(`Wo hast du ${fall.F} N schon gesehen?`, ['beim Tempo', 'bei der Bremskraft', 'bei der Masse'], 1, () => {
      T.schritt = 'B4'; T.bremse = 1; aufgabe(); leisteTeststrecke(); tafel();
      info('Die neue Bremse ist frei.', '#3BA34B');
    });
  });
}

/* Am Ende wird die Regel gebaut – jetzt ist sie hergeleitet, nicht geraten */
function formelBauen() {
  const STEINE = ['F', 's', 'v', 'm', '·', '+', '/'], OPS = ['·', '+', '/'];
  const e = ebene(`<h2 class="mitte">${BRUCH} ist immer die Bremskraft F. Also:</h2>
    <div class="formel"><span class="ziel">ΔE =</span>
      <div class="slot" data-n="0"></div><div class="slot" data-n="1"></div><div class="slot" data-n="2"></div></div>
    <div class="bausteine">${STEINE.map(s => `<button class="stein${OPS.includes(s) ? ' op' : ''}">${s}</button>`).join('')}</div>
    <div class="hinweis" id="hw"></div>
    <div class="knoepfe"><button class="k" id="pruefen">Prüfen</button></div>`, 620);
  const slots = [...e.querySelectorAll('.slot')], inhalt = ['', '', ''];
  const zeige = () => slots.forEach((s, i) => { s.textContent = inhalt[i]; s.classList.toggle('voll', !!inhalt[i]); });
  e.querySelectorAll('.stein').forEach(b => b.onclick = () => { const i = inhalt.indexOf(''); if (i >= 0) { inhalt[i] = b.textContent; zeige(); } });
  slots.forEach((s, i) => s.onclick = () => { inhalt[i] = ''; zeige(); });
  e.querySelector('#pruefen').onclick = () => {
    const r = inhalt.join(' ');
    if (r === 'F · s' || r === 's · F') { e.remove(); arbeitBenennen(); return; }
    // an einer Zeile der Tabelle vorrechnen, warum es nicht passt
    const f = T.fahrten[0], w = { F: f.F, s: f.s, v: kmh(f.v), m: masse() };
    const [a, op, b] = inhalt;
    let text = 'Setz zwei Größen und ein Rechenzeichen ein.';
    if (w[a] != null && w[b] != null && OPS.includes(op)) {
      const x = op === '·' ? w[a] * w[b] : op === '+' ? w[a] + w[b] : w[a] / w[b];
      text = `Erste Fahrt: ${a} ${op} ${b} = ${z(x, x < 100 ? 1 : 0)} – gemessen waren ${z(f.E)} J.`;
    }
    e.querySelector('#hw').textContent = text;
    slots.forEach(wackle);
  };
}

function gutachtenZeigen() {
  kopfZeigen();
  bueroSzene();
  leiste.innerHTML = '';
  const b = stand.beweise;
  const e = ebene(`<div class="gutachten"><h2>📝 Gutachten – Akte 1</h2>
    <div class="akte"><span>⚖ ${b.masse} kg</span><span>🛑 ${b.kraft} N</span><span>📏 ${z(b.spur, 1)} m</span>
      <span>„${fall.behauptet} ${KMH}“ = ${z(fall.vB, 1)} ${MS}</span></div>
    <p class="mitte" style="margin:2px 0;color:#555">Runde auf ganze Zahlen.</p>
    <label><span>Arbeit der Bremse:</span> <input id="e1" inputmode="decimal"> J
      <button class="tippk" data-t="t1" title="Tipp">💡</button><span class="tippf" id="t1" hidden><i>W</i> = <i>F</i> · Δ<i>s</i> <small>Bremskraft · Spurlänge</small></span></label>
    <label><span><i>E</i><sub>kin</sub> bei ${fall.behauptet} ${KMH}:</span> <input id="e2" inputmode="decimal"> J
      <button class="tippk" data-t="t2" title="Tipp">💡</button><span class="tippf" id="t2" hidden><i>E</i><sub>kin</sub> = ${bruchHTML('1', '2')} · <i>m</i> · <i>v</i>² <small><i>v</i> in ${MS}</small></span></label>
    <div class="mitte" id="vergleich" hidden style="margin-top:10px;font-size:1.1rem">Die Arbeit der Bremse ist
      <button class="k hell" data-v="kleiner">kleiner</button> <button class="k hell" data-v="größer">größer</button> als <i>E</i><sub>kin</sub> bei ${fall.behauptet} ${KMH}.</div>
    <div id="urteilsfrage" hidden><h3 class="mitte" style="margin:12px 0 0">Stimmt „höchstens ${fall.behauptet} ${KMH}“?</h3>
    <div class="knoepfe"><button class="k" id="stimmt" style="background:#2E75B6">👍 Stimmt</button><button class="k" id="gelogen" style="background:#D9534F">👎 Gelogen</button></div></div>
    <div class="mitte" id="meldung" style="min-height:28px;margin-top:8px;font-weight:bold"></div></div>`, 820);
  // je Rechnung ein Tipp: die Formel, aufgedeckt erst auf Knopfdruck
  e.querySelectorAll('.tippk').forEach(k => k.onclick = ev => {
    ev.preventDefault();
    e.querySelector('#' + k.dataset.t).hidden = false; k.hidden = true;
  });
  const e1 = e.querySelector('#e1'), e2 = e.querySelector('#e2'), meldung = e.querySelector('#meldung');
  // Wie in der Messtabelle: jede Zahl wird sofort geprüft – richtig wird grün,
  // falsch rot. Geurteilt wird erst, wenn beide Beweise stehen.
  const soll1 = b.kraft * b.spur, soll2 = 0.5 * b.masse * kmh(fall.behauptet) ** 2;
  const pruefen = (inp, ok) => () => {
    if (ok(lies(inp.value))) { inp.className = 'gut'; inp.disabled = true; }
    else { inp.className = 'falsch'; wackle(inp); }
    // stehen beide Energien, werden sie erst verglichen – dann geurteilt
    if (e1.disabled && e2.disabled) e.querySelector('#vergleich').hidden = false;
  };
  const kleiner = soll1 < soll2;
  e.querySelectorAll('#vergleich button').forEach(k => k.onclick = () => {
    if ((k.dataset.v === 'kleiner') !== kleiner) { k.disabled = true; wackle(k); return; }
    e.querySelectorAll('#vergleich button').forEach(x => { x.disabled = true; x.style.opacity = x === k ? 1 : .3; });
    k.classList.add('an');
    e.querySelector('#urteilsfrage').hidden = false;
  });
  e1.onchange = pruefen(e1, w => passt(w, soll1, 0.03));
  e2.onchange = pruefen(e2, w => passt(w, soll2, 0.05) || passt(w, 0.5 * b.masse * fall.vB ** 2, 0.03));
  const urteil = gelogen => {
    if (gelogen === !fall.ehrlich) { e.remove(); ergebnisZeigen(); return; }
    stand.stempel--;
    kopfZeigen();
    // wie auf der Teststrecke: ein Stempel weg, dann die Begründung und weiter
    const kleinerE = soll1 < soll2;
    begruendung(e, meldung, `Die Arbeit der Bremse ist ${kleinerE ? 'kleiner' : 'größer'} als <i>E</i><sub>kin</sub> bei ${fall.behauptet} ${KMH} – er war also ${kleinerE ? 'langsamer' : 'schneller'}.`,
      `Die Aussage „höchstens ${fall.behauptet} ${KMH}“ ${fall.ehrlich ? 'stimmt' : 'stimmt nicht'}.`, neuesGutachten, ergebnisZeigen);
  };
  e.querySelector('#stimmt').onclick = () => urteil(false);
  e.querySelector('#gelogen').onclick = () => urteil(true);
}

/* Nach einem falschen Urteil: Stempel ist schon weg, jetzt die Begründung.
   Danach geht es zum Ergebnis – oder, ohne Stempel, in ein neues Gutachten. */
function begruendung(e, meldung, grund, satz, neu, ergebnis) {
  // Urteilsknöpfe weg, damit die Begründung ohne Scrollen zu sehen ist
  e.querySelector('#urteilsfrage').hidden = true;

    <div class="knoepfe"><button class="k" id="weiterU">Weiter ➜</button></div>`;
  wackle(meldung);
  meldung.scrollIntoView({ block: 'end' });
  meldung.querySelector('#weiterU').onclick = () => { e.remove(); if (stand.stempel <= 0) neu(); else ergebnis(); };
}

    const schritt = (id, links, einheit, tipp) => `<label><span>${links}</span> <input id="${id}" inputmode="decimal" disabled> <span>${einheit}</span>

    const felder = [['w1', E, 0.03], ['w2', vMS, 0.04], ['w3', vKMH, 0.05]];

    e.querySelector('#pruef').onclick = () => { const i = felder.findIndex(([id]) => !e.querySelector('#' + id).disabled); if (i >= 0) pruefe(i); };

/* Hat die Kundin die verbotene Rampe genommen? Der Verleih schließt von der
   Energie auf den Weg – das geht nicht, beide Wege kosten gleich viel. Erst die
   Motorkraft verrät den Weg. Die Massen sind so gewählt, dass F · s auf beiden
   Wegen und m · g · h auf die ganze Zahl genau gleich herauskommen. */
const G = 9.81;
function neuerFall2() {
  const m = [58, 63, 74, 79][Math.floor(Math.random() * 4)];
  const h = [5, 6, 8][Math.floor(Math.random() * 3)];
  const Eh = m * G * h, sR = 2.5 * h, sS = 10 * h;
  const FR = Math.round(Eh / sR * 10) / 10, FS = Math.round(Eh / sS * 10) / 10;
  const vorher = [18000, 20000, 24000][Math.floor(Math.random() * 3)];
  return { m, h, E: Math.round(Eh), Eh, sR, sS, FR, FS, vorher, nachher: vorher - Math.round(Eh), rampe: Math.random() < 0.5 };
}
let fall2 = neuerFall2();

function fall2Buero() {
  fall2 = neuerFall2();
  stand.stempel = 3; stand.beweise = {}; stand.aufgerollt = false;

function hubRegelBauen() {

/* Wie fest war der Schubs? Ein Video zeigt Tacho und Pflasterfugen. Der Kniff:
   Der E-Scooter rollte schon. Wer die Energie vorher vergisst, hält eine ehrliche
   Aussage für gelogen. Gezogen werden nur Fälle mit ganzzahliger Kraft. */
const FUGE_X0 = 60, PM = 100;                    // Video: linker Rand, Pixel je Meter
function neuerFall3() {
  const moeglich = [];
  for (const m of [50, 60]) for (const vv of [1, 2]) for (const vn of [3, 4]) for (const s of [1.5, 2]) {
    const W = 0.5 * m * (vn * vn - vv * vv), F = W / s;
    if (Number.isInteger(F)) moeglich.push({ m, vv, vn, s, W, F });
  }
  const f = moeglich[Math.floor(Math.random() * moeglich.length)];
  f.Ev = 0.5 * f.m * f.vv ** 2; f.En = 0.5 * f.m * f.vn ** 2;
  f.ehrlich = Math.random() < 0.34;
  // ehrlich: knapp über der wirklichen Kraft, aber unter dem, was ohne E_vorher herauskäme
  const ohneVorher = f.En / f.s;
  f.Fbeh = f.ehrlich ? Math.ceil((f.F + 1) / 10) * 10 : Math.max(40, Math.round(f.F * 0.5 / 10) * 10);
  if (f.ehrlich && f.Fbeh >= ohneVorher) f.Fbeh = f.F;
  // Bilder des Videos: 8 vor dem Schubs, k im Schubs, dann bis zum Fahrradständer
  const xs = 2.5, a = (f.vn ** 2 - f.vv ** 2) / (2 * f.s), tp = (f.vn - f.vv) / a;
  const k = Math.max(3, Math.round(tp / 0.1)), bilder = [];
  for (let i = 8; i > 0; i--) bilder.push({ x: xs - f.vv * i * 0.1, v: f.vv, kontakt: false });
  for (let j = 0; j <= k; j++) { const t = j * tp / k; bilder.push({ x: xs + f.vv * t + a * t * t / 2, v: f.vv + a * t, kontakt: true }); }
  const xe = xs + f.s;
  for (let j = 1; xe + f.vn * j * 0.1 < 6.6; j++) bilder.push({ x: xe + f.vn * j * 0.1, v: f.vn, kontakt: false, nach: true });
  bilder.push({ x: 6.7, v: 0, kontakt: false, nach: true, crash: true });
  f.bilder = bilder; f.start = 8; f.ende = 8 + k; f.xs = xs; f.xe = xe;
  return f;
}

      stand.beweise.video = { vv: f.vv, vn: f.vn, s: f.s };

    };
    inp.onkeydown = ev => { if (ev.key === 'Enter') leiste.querySelector('#ok').click(); };
  }
  zeichne();
}

/* Auswertung: Was macht der Schubs? → beide Energien → W = ΔE = nachher − vorher.
   Das Vorzeichen von W ergibt sich aus der Rechnung, wie beim Δ der Geschwindigkeit. */
const EV = '<i>E</i><sub class="ix">vorher</sub>', EN = '<i>E</i><sub class="ix">nachher</sub>';
const BILANZ = `<i>W</i> = Δ<i>E</i> = ${EN} − ${EV}`;
function schubsAuswerten() {
  const f = fall3;
  kopfZeigen();
  bueroSzene(null, 'AKTE 3');
  leiste.innerHTML = '';
  const tippEkin = `<i>E</i><sub>kin</sub> = ${bruchHTML('1', '2')} · <i>m</i> · <i>v</i>² <small><i>v</i> in ${MS}</small>`;
  const feld = (id, links, einheit, tipp) => `<label><span>${links}</span> <input id="${id}" inputmode="decimal"> ${einheit}
      <button class="tippk" data-t="t${id}" title="Tipp">💡</button><span class="tippf" id="t${id}" hidden>${tipp}</span></label>`;
  const e = ebene(`<div class="gutachten"><h2 class="mitte">📹 Auswertung des Videos</h2>
    <div class="akte"><span>⚖ ${f.m} kg</span><span>vor dem Schubs: ${z(f.vv * 3.6, 1)} ${KMH}</span><span>danach: ${z(f.vn * 3.6, 1)} ${KMH}</span><span>📏 ${z(f.s, 1)} m</span></div>
    <div id="fazit"></div><div id="schritt"></div></div>`, 800);
  const fazit = (t, kern) => e.querySelector('#fazit').insertAdjacentHTML('beforeend', `<div class="fazit${kern ? ' kern' : ''}">${t}</div>`);
  const schritt = e.querySelector('#schritt');
  const tipps = () => schritt.querySelectorAll('.tippk').forEach(k => k.onclick = ev => { ev.preventDefault(); schritt.querySelector('#' + k.dataset.t).hidden = false; k.hidden = true; });
  const pruefe = (inp, soll, danach, sonst) => () => {
    if (!inp.value.trim()) return;
    const x = lies(inp.value);
    if (passt(x, soll, 0.01)) { inp.className = 'gut'; inp.disabled = true; danach(); return; }
    inp.className = 'falsch'; wackle(inp);
    if (sonst) sonst(x);
  };
  frageIn(schritt, 'Was macht der Schubs mit der Energie des E-Scooters?', ['Er führt ihm Energie zu', 'Der E-Scooter gibt Energie ab', 'nichts'], 0, () => {
    // das Fazit gleich nach der richtigen Antwort
    fazit('Der Schubs führt dem System Energie in Form von Arbeit zu.', true);
    schritt.innerHTML = `<p class="mitte" style="margin:2px 0;color:#555">Runde auf ganze Zahlen.</p>
      ${feld('ev', '<i>E</i><sub>kin</sub> vor dem Schubs:', 'J', tippEkin)}
      ${feld('en', '<i>E</i><sub>kin</sub> nach dem Schubs:', 'J', tippEkin)}
      <div id="wfeld"></div>`;
    tipps();
    const ev = schritt.querySelector('#ev'), en = schritt.querySelector('#en');
    const beide = () => { if (ev.disabled && en.disabled) arbeit(); };
    const arbeit = () => wRechnen(schritt.querySelector('#wfeld'), f.Ev, f.En, () => {
      fazit('<i>W</i> ist positiv: Dem System wird von außen Energie zugeführt.', true);
      const unten = schritt.querySelector('#wfeld');
      unten.insertAdjacentHTML('beforeend', '<div class="knoepfe"><button class="k" id="weiter">Und die Bremse in Fall 1? ➜</button></div>');
      unten.querySelector('#weiter').onclick = () => { e.remove(); rueckblickBremse(); };
      unten.scrollIntoView({ block: 'end' });
    });
    ev.onchange = pruefe(ev, f.Ev, beide);
    en.onchange = pruefe(en, f.En, beide);
    ev.focus();
    schritt.scrollIntoView({ block: 'end' });
  });
}

/* W = ΔE = E_nachher − E_vorher mit den eigenen Zahlen – das Vorzeichen kommt
   aus der Rechnung. Wer vorher minus nachher rechnet, bekommt einen Hinweis. */
function wRechnen(ziel, Ev, En, weiter) {
  ziel.innerHTML = `<div class="formel"><span class="ziel">${BILANZ}</span></div>
    <label style="justify-content:center"><span><i>W</i> = ${z(En)} J − ${z(Ev)} J =</span> <input id="wv" inputmode="text"> J</label>
    <div class="hinweis" id="hw2"></div>`;
  const inp = ziel.querySelector('#wv'), hw = ziel.querySelector('#hw2');
  inp.focus();
  inp.onchange = () => {
    if (!inp.value.trim()) return;
    const x = lies(inp.value);
    if (!isNaN(x) && Math.abs(x - (En - Ev)) <= Math.max(1, Math.abs(En - Ev) * 0.01)) {
      inp.className = 'gut'; inp.disabled = true; hw.textContent = ''; weiter(); return;
    }
    inp.className = 'falsch'; wackle(inp);
    hw.textContent = passt(Math.abs(x), Math.abs(En - Ev), 0.01) ? 'Achte auf das Vorzeichen: nachher minus vorher.'
      : passt(x, En, 0.01) ? 'Der E-Scooter hatte vorher schon Energie.' : '';
  };
  ziel.scrollIntoView({ block: 'end' });
}

/* Eine Aufgabe besteht aus Schritten: Zahl eintragen (sofort grün oder rot,

const zufall = a => a[Math.floor(Math.random() * a.length)];
const GN = `<i>g</i> = 9,81 ${bruchHTML('N', 'kg')}`;
const RUNDE = ['Runde auf ganze Zahlen.', 'Runde auf eine Nachkommastelle.'];

function aufgabeZeigen(A, nummer, fertig) {
  let fehler = 0, i = 0;
  aufgabeZeigen.aktuell = A;                  // fürs Testskript
  const e = ebene(`<div class="gutachten"><h2>${nummer ? `Aufgabe ${nummer}: ` : ''}${A.titel} <span style="color:#C9A000">${A.stufe}</span></h2>

      ${A.extra ? `<button class="k hell" id="extra">${A.extra.text}</button>` : ''}</div></div>`, 780);
  const box = e.querySelector('#schritte');
  // In Schritten: Die Teilschritte ersetzen die eine Rechnung – nur, solange noch nichts gelöst ist

    if (i > 0) return;
    A.schritte = A.einzeln; box.innerHTML = ''; e.querySelector('#einzeln').remove(); schritt();
  };
  if (A.extra) e.querySelector('#extra').onclick = () => { e.remove(); A.extra.aktion(); };
  const weiter = () => {
    i++;
    if (i < A.schritte.length) { schritt(); return; }
    e.querySelector('#hilfen').innerHTML = '';
    e.querySelector('#ende').innerHTML = '<div class="knoepfe"><button class="k" id="w">Weiter ➜</button></div>';
    e.querySelector('#w').onclick = () => { e.remove(); fertig(fehler); };
    e.querySelector('#w').scrollIntoView({ block: 'end' });
  };
  const fazit = t => { if (t) e.querySelector('#fazit').insertAdjacentHTML('beforeend', `<div class="fazit kern">${t}</div>`); };
  function schritt() {
    const s = A.schritte[i], d = document.createElement('div');

      d.innerHTML = `${s.frage ? `<p class="mitte" style="margin:8px 0 0;font-weight:bold">${s.frage}</p>` : ''}
        <div class="knoepfe">${s.optionen.map((o, j) => `<button class="k hell" data-j="${j}">${o}</button>`).join('')}</div>`;
      d.querySelectorAll('[data-j]').forEach(b => b.onclick = () => {
        // 'frei': jede Wahl gilt, die Folgen kommen danach (Gabelung)
        if (s.frei) A.gewaehlt = +b.dataset.j;
        else if (+b.dataset.j !== s.richtig) { fehler++; b.disabled = true; wackle(b); return; }
        d.querySelectorAll('[data-j]').forEach(x => { x.disabled = true; x.style.opacity = x === b ? 1 : .3; });
        b.classList.add('an');
        fazit(s.fazit); weiter();
      });
      return;

    d.innerHTML = `${s.frage ? `<p class="mitte" style="margin:8px 0 2px;font-weight:bold">${s.frage}</p>` : ''}<label style="justify-content:center"><span>${s.label}</span> <input inputmode="decimal"> ${s.einheit}

    const inp = d.querySelector('input');
    d.querySelector('.tippk').onclick = ev => { ev.preventDefault(); d.querySelector('.tippf').hidden = false; ev.target.hidden = true; };
    inp.focus();
    inp.onchange = () => {
      if (!inp.value.trim()) return;
      const x = lies(inp.value);
      // gerundet richtig: höchstens eine halbe letzte Stelle daneben, oder 1 %
      if (!isNaN(x) && Math.abs(x - s.soll) <= Math.max(0.6 * 10 ** -s.nks, Math.abs(s.soll) * (s.tol || 0.01))) {
        inp.className = 'gut'; inp.disabled = true; weiter(); return;
      }
      fehler++; inp.className = 'falsch'; wackle(inp);
    };
    d.scrollIntoView({ block: 'end' });
  }
  schritt();
}

// ================================================================ Üben: Beweisfahrt

/* Fortsetzung des Gutachters als Fahrspiel: Das Beweisstück muss bis 12 Uhr ins
   Gericht. Jedes Level ist eine Etappe mit eigener Ankunftszeit (Fahrplan).
   Zwei Größen, beide aus der Geschichte: die Uhr und der Akku.
   - Der E-Scooter fährt von selbst, ein Regler stellt das Tempo ein. Schneller
     ist früher da, jedes Anfahren kostet aber mehr Akku: W = F · Δs. Bergauf
     kostet die Hubarbeit m · g · Δh, bergab rollt er von selbst schneller.
     Ohne Reibung kostet gleichbleibendes Tempo in der Ebene nichts. Leer: schieben.
   - Ladesäule: ●○○ laden oder ●●● schnell laden – nur mit richtiger Rechnung.
   - Level 1: rote Ampel mit Bremsweg. Level 2: Vorzeichen der Arbeit im Fahren,
     ohne Anhalten. Level 3: Gabelung Rampe/Umweg, Abfahrt ohne Motor, Bremsweg
     aus m · g · Δh = F · Δs, Stoppschild. Level 4: Schotter (W negativ), Kran
     (Hubarbeit). Level 5: Ampel, Auffahrt mit Schwung.
   - „Spiel beenden“ rechts unten: Urkunde mit den bisher geschafften Etappen.
     An Ampel, Schranke und Stoppschild eine Frage, danach durch die richtige Antwort.
   - Fehler kosten Zeit.
   Solange gerechnet wird, steht die Uhr. Welt in Metern, PX Pixel je Meter,
   die Strecke hat ein Höhenprofil (Punkte [x, h] in Metern). */
const PX = 40, BODEN = 400, FRAGE_ABSTAND = 14, LAENGE = 2.2;   // LAENGE: E-Scooter von hinten bis vorn
const FAHRT = { MOTOR: 120, ANFAHRT: 1.5, AUSROLL: 0.3, MASSE: 80, SPRUNG: 8.5, SCHWERE: 13, SPRUNG_V: 4.5,
                STRAFE: 3, SCHIEBEN: 5, LADEN: 2500, SCHNELL: 4000, UMWEG: 2, MIN_JE_S: 0.25 };
stand.fahrt = { sterne: [0, 0, 0, 0, 0], frei: 1, joker: null };   // Joker: die Stempel aus den Fällen
const uhr = min => `${Math.floor(min / 60)}:${String(Math.floor(min % 60)).padStart(2, '0')}`;
const kmhZahl = v => z(Math.round(v * 3.6), 0);             // der Regler steht auf ganzen km/h

/* Fragen an Ampel und Schranke: [Frage, richtig, falsch, Fazit] */
const FRAGEN_STADT = [

const torFrage = ([frage, richtig, falsch, fazit]) => {
  const oben = Math.random() < 0.5;                // Springen ist nicht immer richtig
  return { frage, fazit, oben: oben ? richtig : falsch, unten: oben ? falsch : richtig, richtigOben: oben };
};
const gemischt = a => [...a].sort(() => Math.random() - 0.5);

/* Aufgaben an der Ladesäule je Level: normal ●○○, schnell ●●● */

    // Energieänderung aus Fall 3: E_nachher = E_vorher + W
    schnell: () => { const v0 = zufall([2, 3]), v1 = v0 + 2, m = FAHRT.MASSE, W = 0.5 * m * (v1 * v1 - v0 * v0), s = zufall([8, 10]), F = W / s;
      return { titel: '⚡ Schnellladen', stufe: '●●●', chips: [`⚖ ${m} kg`, `🛴 du fährst ${v0} ${MS}`, `Motor schiebt: ${F} N`, `📏 Δ<i>s</i> = ${s} m`],
        frage: 'Wie schnell bist du danach?',
        schritte: [{ label: '<i>v</i> =', einheit: MS, soll: v1, nks: 1, tipp: '<i>E</i><sub>nachher</sub> = <i>E</i><sub>vorher</sub> + <i>W</i>' }],
