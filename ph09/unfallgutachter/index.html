function level1() {
  // Ladesäule erst nach der Ampel – der Akku reicht bei hohem Tempo nicht bis ins Ziel
  const elemente = [
    { typ: 'kegel', x: 12 },
    { typ: 'kegel', x: 40 },
    { typ: 'ampel', x: 70, F: zufall([200, 250, 300]), ...torFrage(gemischt(FRAGEN_STADT)[0]) },
    { typ: 'lade', x: 100 },
    { typ: 'kegel', x: 112 },
    { typ: 'ziel', x: 122 },
  ];
  // die ersten Meter nur Häuser – erst einmal ankommen und das Tempo ausprobieren
  const RUHE = 22;
  return { name: 'Altstadt', ziel: 'Marktplatz', kulisse: 'stadt', laenge: 124 + RUHE, akku: 3000,
           start: 11 * 60, frist: 11 * 60 + 15, sterne: [11 * 60 + 7, 11 * 60 + 10, 11 * 60 + 15],
           profil: [[0, 0], [400, 0]],
           neu: [],
           elemente: elemente.map(e => ({ ...e, x: e.x + RUHE })) };
}

/* Level 2: Stadtpark – das Vorzeichen der Arbeit, ohne Rechnen und ohne Anhalten.
   Von oben fallen kurze Situationen; das genannte Ding ist das System.
   W > 0 (Energie zugeführt): springen, W < 0 (Energie abgegeben): durchfahren. */
const SITUATIONEN = [
  ['Ball wird geworfen', true], ['Kiste wird gehoben', true], ['Schlitten wird angeschoben', true],
  ['Feder wird gespannt', true], ['Pfeil wird abgeschossen', true], ['Koffer wird hochgetragen', true],
  ['Wagen wird beschleunigt', true], ['Bogen wird gespannt', true],
  ['Ball wird gefangen', false], ['Kiste wird abgesetzt', false], ['Fahrrad wird gebremst', false],
  ['Feder entspannt sich', false], ['Last wird abgelassen', false], ['Puck wird gestoppt', false],
  ['Läufer bremst ab', false], ['Auto bremst', false],
];
function level2() {
  const R = 20, hB = 1.5;
  // vier mit W > 0, vier mit W < 0, gemischt
  const plus = gemischt(SITUATIONEN.filter(x => x[1])).slice(0, 4), minus = gemischt(SITUATIONEN.filter(x => !x[1])).slice(0, 4);
  const liste = gemischt([...plus, ...minus]);
  const start = 70 + R, abstand = 35;          // Abstand = Zeit zum Nachdenken
  return {
    name: 'Stadtpark', ziel: 'Parkausgang', kulisse: 'park', laenge: start + liste.length * abstand + 10, akku: 6500, uhr: 0.14,
    start: 11 * 60 + 15, frist: 11 * 60 + 30, sterne: [11 * 60 + 23, 11 * 60 + 26, 11 * 60 + 30],
    profil: [[0, 0], [30 + R, 0], [36 + R, hB], [44 + R, hB], [50 + R, 0], [400, 0]],
    neu: [
      'Hier zählt das Vorzeichen der Arbeit.',
      'Energie wird zugeführt: <i>W</i> > 0 → <b>⤒ springen</b>.',
      'Energie wird abgegeben: <i>W</i> < 0 → <b>durchfahren</b>.',
      'Über die Enten springst du mit <b>⤒ Springen</b>.'],
    elemente: [
      { typ: 'ente', x: 12 + R },
      { typ: 'ente', x: 22 + R },
      ...liste.map(([text, plus], i) => ({ typ: 'vz', x: start + i * abstand, text, richtigOben: plus, oben: 'W > 0', unten: 'W < 0' })),
      { typ: 'ziel', x: start + liste.length * abstand + 6 },
    ],
  };
}

/* Level 3: Bergstraße – Steinfeld, an der Gabelung Rampe oder Umweg hinauf
   (gleiche Hubarbeit, andere Kraft), oben die Ladesäule, dann ohne Motor
   steil bergab und vor dem Stoppschild bremsen: m · g · Δh = F · Δs. */
function level3() {
  const h = zufall([4, 5, 6]), F = zufall([300, 400]), sR = zufall([20, 25, 30]), sU = 40, Fmax = 150;
  const fussBerg = 58, oben = fussBerg + sU, kante = oben + 20, fuss = kante + 14, stopp = fuss + 20;
  return {
    name: 'Bergstraße', ziel: 'Ortseingang', kulisse: 'berg', laenge: stopp + 36, akku: 7000,
    start: 11 * 60 + 30, frist: 11 * 60 + 45, sterne: [11 * 60 + 39, 11 * 60 + 42, 11 * 60 + 45],
    profil: [[0, 0], [fussBerg, 0], [oben, h], [kante, h], [fuss, 0], [stopp + 80, 0]],
    berg: { h, F, kante, fuss, weg: sU },
    gabel: { x: fussBerg - 8, hH: h, sR, sU, Fmax, F: FAHRT.MASSE * G * h / sR, fuss: fussBerg, oben },
    neu: [
      'Über die Steine springst du mit <b>⤒ Springen</b>.',
      'Bergab fährst du ohne Motor. Bremsen kannst du erst unten vor dem Stoppschild.'],
    elemente: [
      // Steinfeld am Anfang: Sprung auf Sprung, bei jedem Tempo machbar
      ...[12, 21, 30, 39].map(x => ({ typ: 'stein', x })),
      { typ: 'gabel', x: fussBerg - 8 },
      { typ: 'lade', x: oben + 6 },
      { typ: 'gipfel', x: kante },
      { typ: 'stopp', x: stopp, F, ...torFrage(gemischt([...FRAGEN_BERG, ...FRAGEN_PARK])[0]) },
      { typ: 'ziel', x: stopp + 32 },
    ],
  };
}
/* Level 4: Baustelle – das Vorzeichen beim Rechnen (Fall 3). Schotter bremst bei
   ausgeschaltetem Motor: E_nachher = E_vorher + W mit W < 0, ein Blitzer misst
   nach. Der Kran hebt dich samt Aktenkiste aufs Gerüst (Hubarbeit, W > 0).
   Kein Tor, an der Säule nur normales Laden.
   Kürzere Etappe: Die Uhr läuft langsamer, damit es bis 12 Uhr aufgeht. */
function level4() {
  const W = 106, hK = zufall([3, 4]), mK = zufall([10, 15, 20]);
  return {
    name: 'Baustelle', ziel: 'Baustellenende', kulisse: 'bau', laenge: W + 42, akku: 6000, uhr: 0.17, nurLaden: true,
    start: 11 * 60 + 45, frist: 11 * 60 + 53, sterne: [11 * 60 + 50, 11 * 60 + 51, 11 * 60 + 53], strafe: 2,
    profil: [[0, 0], [W, 0], [W, hK], [W + 20, hK], [W + 30, 0], [W + 100, 0]],
    neu: ['Über die Baken springst du mit <b>⤒ Springen</b>.'],
    elemente: [
      { typ: 'bake', x: 14 }, { typ: 'bake', x: 23 },
      { typ: 'schotter', x: 42, s: zufall([8, 10]) },
      { typ: 'lade', x: 66 },
      { typ: 'bake', x: 80 }, { typ: 'bake', x: 89 },
      { typ: 'kran', x: W, h: hK, mK },
      { typ: 'bake', x: W + 12 },
      { typ: 'ziel', x: W + 40 },
    ],
  };
}
/* Level 5: Gerichtshügel – das Finale. Ampel wie in Level 1, danach die Säule,
   dann die Auffahrt zum Gericht ohne Motor: genug Schwung holen, ½ · m · v² = m · g · Δh. */
function level5() {
  const fuss = 124, h = zufall([1.2, 1.6, 2]), oben = fuss + 8;
  return {
    name: 'Gerichtshügel', ziel: 'Gericht', kulisse: 'stadt', laden: 'gericht', laenge: oben + 4, akku: 5000, uhr: 0.15,
    start: 11 * 60 + 53, frist: 12 * 60, sterne: [11 * 60 + 57, 11 * 60 + 59, 12 * 60], strafe: 2,
    profil: [[0, 0], [fuss, 0], [oben, h], [oben + 60, h]],
    neu: ['Über die Hütchen springst du mit <b>⤒ Springen</b>.'],
    elemente: [
      { typ: 'kegel', x: 10 },
      { typ: 'ampel', x: 46, F: zufall([200, 250, 300]), ...torFrage(gemischt([...FRAGEN_STADT, ...FRAGEN_PARK, ...FRAGEN_BERG, ...FRAGEN_BAU])[0]) },
      { typ: 'lade', x: 76 },
      { typ: 'kegel', x: 86 }, { typ: 'kegel', x: 94 },
      { typ: 'auffahrt', x: fuss, h, oben },
      { typ: 'gericht', x: oben + 3 },
      { typ: 'ziel', x: oben + 1.5 },
    ],
  };
}
const LEVEL = [level1, level2, level3, level4, level5];
const LEVELCODE = [null, 'MARKT', 'PARK', 'BERG', 'KRAN'];         // Code für Level n+1 – steht am Ende von Level n

const endeKnopf = an => document.getElementById('spiel').classList.toggle('fahrt', an);
document.getElementById('spielende').onclick = () => {
  if (buehne.querySelector('#endefrage')) return;
  const S = levelFahren.lauf === lauf ? levelFahren.S : null, lief = S && !S.pause && !S.fertig;
  if (lief) S.pause = true;
  const e = ebene(`<div class="mitte" id="endefrage"><h2>Spiel beenden und die Urkunde holen?</h2>
    <div class="knoepfe"><button class="k" id="ja">🏆 Zur Urkunde</button><button class="k hell" id="nein">Weiterfahren</button></div></div>`, 520);
  e.querySelector('#ja').onclick = urkundeZeigen;
  e.querySelector('#nein').onclick = () => { e.remove(); if (lief) levelFahren.weiter(); };
};

/* Urkunde: alle Etappen mit ihren Sternen, nicht gefahrene mit Strich.
   Für Schnelle: ★★★ in allen Etappen gibt das goldene Siegel. */
function urkundeZeigen() {
  lauf++; endeKnopf(false); document.onkeydown = document.onkeyup = null;
  stand.stempel = stand.fahrt.joker ?? 3; kopfZeigen();
  const st = stand.fahrt.sterne, summe = st.reduce((a, b) => a + b, 0), geschafft = st.filter(x => x > 0).length;
  const alle = st[LEVEL.length - 1] > 0 && geschafft === LEVEL.length, gold = summe === 3 * LEVEL.length;
  const satz = gold ? 'Alle Etappen mit ★★★ – eine Profi-Fahrt!'
    : alle ? 'Das Beweisstück ist pünktlich im Gericht.'
    : geschafft ? `${geschafft} von ${LEVEL.length} Etappen geschafft.` : 'Noch keine Etappe geschafft.';
  const zeilen = LEVEL.map((f, i) => { const y = 196 + i * 34;
    return `<text x="300" y="${y}" font-size="21" ${SCHRIFT}>Level ${i + 1}: ${f().name}</text>
      <text x="660" y="${y}" text-anchor="end" font-size="23" fill="#C9A000" ${SCHRIFT}>${st[i] ? '★'.repeat(st[i]) + '☆'.repeat(3 - st[i]) : '–'}</text>`; }).join('');
  const siegel = gold ? ['#C9A000', '★', 'GOLD'] : alle ? ['#C0392B', '§', 'GERICHT'] : ['#2E75B6', '🛴', 'FAHRT'];
  buehne.innerHTML = SVG(`
    <rect width="960" height="470" fill="#E9DFC9"/><rect x="0" y="380" width="960" height="90" fill="#B58B5E"/>
    <rect x="236" y="22" width="488" height="430" rx="6" fill="#FFF8E7" stroke="#C9A000" stroke-width="6"/>
    <rect x="248" y="34" width="464" height="406" rx="4" fill="none" stroke="#C9A000" stroke-width="2"/>
    <text x="480" y="92" text-anchor="middle" font-size="44" font-weight="bold" letter-spacing="6" ${SCHRIFT}>URKUNDE</text>
    <text x="480" y="128" text-anchor="middle" font-size="22" ${SCHRIFT}>Beweisfahrt zum Gericht</text>
    <line x1="300" y1="148" x2="660" y2="148" stroke="#C9A000" stroke-width="2"/>
    ${zeilen}
    <text x="300" y="${196 + LEVEL.length * 34 + 6}" font-size="21" font-weight="bold" ${SCHRIFT}>Zusammen</text>
    <text x="660" y="${196 + LEVEL.length * 34 + 6}" text-anchor="end" font-size="21" font-weight="bold" ${SCHRIFT}>${summe} von ${3 * LEVEL.length} ★</text>
    ${zeile(satz, 412, 20, '#222')}
    ${alle && !gold ? zeile('Für Profis: ★★★ überall gibt das goldene Siegel.', 438, 15, '#777') : ''}
    <g transform="translate(664,96) rotate(-12)"><circle r="44" fill="${siegel[0]}"/><circle r="36" fill="none" stroke="#fff" stroke-width="2"/>
      <text y="6" text-anchor="middle" font-size="28" fill="#fff" ${SCHRIFT}>${siegel[1]}</text>
      <text y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" ${SCHRIFT}>${siegel[2]}</text></g>`);

function beweisfahrtStart() {
  lauf++; endeKnopf(true); document.onkeydown = document.onkeyup = null;
  stand.beweise = {};
  if (stand.fahrt.joker == null) stand.fahrt.joker = 3;          // Einstieg mit Code: drei Joker
  stand.stempel = stand.fahrt.joker;
  kopfZeigen();
  bueroSzene('Das Beweisstück muss\nbis 12 Uhr ins Gericht!', 'BEWEIS');
  leiste.innerHTML = `${LEVEL.map((f, i) => { const L = f(), offen = i < stand.fahrt.frei;
      return `<button class="k${offen ? '' : ' hell'}" data-l="${i}">${offen ? '🛴' : '🔒'} ${i + 1} ${L.name} ${'★'.repeat(stand.fahrt.sterne[i])}</button>`; }).join('')}`;
  leiste.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
    const i = +b.dataset.l;
    if (i < stand.fahrt.frei) { levelFahren(i); return; }
    // gesperrt: Code des Levels eingeben (nach dem Neuladen)
    const e = ebene(`<div class="mitte"><h2>🔑 Code für Level ${i + 1}</h2>
      <input id="c" autocomplete="off" style="font:inherit;font-size:1.3rem;width:9em;text-align:center;text-transform:uppercase;padding:6px;border:2px solid #9a8f73;border-radius:8px">
      <div class="knoepfe"><button class="k" id="ok">Öffnen</button><button class="k hell" id="zu">Zurück</button></div></div>`, 420);
    const c = e.querySelector('#c'); c.focus();
    e.querySelector('#zu').onclick = () => e.remove();
    e.querySelector('#ok').onclick = () => {
      if (c.value.trim().toUpperCase() !== LEVELCODE[i]) { wackle(c); return; }
      stand.fahrt.frei = Math.max(stand.fahrt.frei, i + 1); levelFahren(i);
    };
    c.onkeydown = ev => { if (ev.key === 'Enter') e.querySelector('#ok').click(); };
  });
}

    if (!S.pause && !S.fertig) schritt(dt);
    zeichne();
    requestAnimationFrame(tick);
  }
  function schritt(dt) {
    const x0 = S.x, h0 = hBoden(S.x);
    if (!S.halt) S.minuten += dt * (L.uhr || FAHRT.MIN_JE_S);     // beim Nachdenken an der Frage steht die Uhr
    const steig = (hBoden(S.x + 0.2) - hBoden(S.x - 0.2)) / 0.4;
    let beschleunigt = false;
    if (S.halt) S.v = 0;
    else if (S.schotter) {
      // Motor aus: vor dem Schotter gleich schnell, darauf bremst er – genau wie gerechnet
      const g = S.schotter;
      if (S.x < g.x) S.v = g.v0;
      else if (S.x < g.x + g.s) S.v = Math.sqrt(Math.max(0.01, g.v0 ** 2 - 2 * g.F * (S.x - g.x) / FAHRT.MASSE));
      else if (S.x < g.x + g.s + 8) {
        // danach noch ein Stück ohne Motor weiterrollen – das neue Tempo soll man sehen
        S.v = g.v1;
        if (!g.geblitzt) { g.geblitzt = true; meldung(`📸 vorher ${z(g.v0, 1)} {m/s} → nachher ${z(g.v1, 1)} {m/s}`, '#3BA34B'); }
      } else { S.v = g.v1; S.schotter = null; regler.disabled = false; }
    } else if (S.auffahrt && S.x >= S.auffahrt.fuss) {
      // ab dem Schild nur Schwung: Bewegungsenergie wird zu Höhenenergie
      const a = S.auffahrt;
      if (a.v0 == null) { a.v0 = S.v; regler.disabled = true; meldung(`Motor aus – du fährst ${kmhZahl(S.v)} {km/h}`); }
      const v2 = a.v0 ** 2 - 2 * G * hBoden(S.x);
      if (v2 <= 0.05) { S.auffahrt = null; S.x = a.oben + 0.3; S.v = 1.5; zeitStrafe('Zu wenig Schwung – du schiebst!'); }
      else { S.v = Math.sqrt(v2); if (S.x >= a.oben) { S.auffahrt = null; meldung('✔ Der Schwung reicht!', '#3BA34B'); } }
    } else if (S.ampel) {
      // Tempomat bis zur Bremse, dann Vollbremsung mit genau der Kraft der Aufgabe
      const r = S.ampel.rollen;
      if (r && !S.vollbremsung) {
        // Energieerhaltung: das Tempo kommt nur aus der Höhe, ein kleiner Schubs an der Kante
        S.v = Math.max(0.8, Math.sqrt(2 * G * Math.max(0, r.hTop - hBoden(S.x))));
        if (S.bremse && S.x < r.fuss && !erledigt.has('bremsHinweis')) { erledigt.add('bremsHinweis'); meldung('Bremse erst unten!'); }
      }
      if (S.bremse && !S.vollbremsung && (!r || S.x >= r.fuss)) S.vollbremsung = S.ampel;
      if (S.vollbremsung) { S.v = Math.max(0, S.v - S.vollbremsung.F / FAHRT.MASSE * dt); if (S.v === 0) ampelHalt(S.ampel); }
      else if (S.x > S.ampel.x) ampelHalt(S.ampel);                 // gar nicht gebremst
    } else {
      if (steig < -0.01) S.v += 9.81 * -steig / Math.sqrt(1 + steig * steig) * dt;        // bergab: von selbst schneller
      else if (steig > 0.01 && S.akku <= 0) S.v = Math.max(0, S.v - 9.81 * steig * dt);  // bergauf ohne Akku
      if (S.bremse || S.anhalten) S.v = Math.max(0, S.v - 300 / FAHRT.MASSE * dt);
      else if (S.v < S.zielV && S.akku > 0) { S.v = Math.min(S.zielV, S.v + FAHRT.ANFAHRT * dt); beschleunigt = true; }
      else if (S.v > S.zielV && steig >= -0.01) S.v = Math.max(S.zielV, S.v - FAHRT.AUSROLL * 3 * dt);
      else if (S.akku <= 0 && steig >= -0.01) S.v = Math.max(0, S.v - FAHRT.AUSROLL * dt);
    }
    S.x += S.v * dt;
    if (S.anhalten && S.v === 0 && S.y === 0) { S.anhalten = false; S.pause = true; pausiert = true; bremsKnopfZeigen(); return; }
    // Akku: Anfahren kostet W = F · Δs, bergauf die Hubarbeit m · g · Δh
    if (beschleunigt) S.akku -= FAHRT.MOTOR * (S.x - x0);
    const dh = hBoden(S.x) - h0;
    if (dh > 0 && S.akku > 0) S.akku -= FAHRT.MASSE * 9.81 * dh;
    if (S.akku <= 0 && S.v === 0 && !S.halt && !S.ampel) { S.akku = 1500; zeitStrafe('Akku leer – du schiebst!', FAHRT.SCHIEBEN); }
    if (S.y > 0 || S.vy > 0) { S.vy -= FAHRT.SCHWERE * dt; S.y = Math.max(0, S.y + S.vy * dt); if (S.y === 0) S.vy = 0; }
    S.yMax = Math.max(S.yMax, S.y);
    let vzNaechste = true;
    for (const el of L.elemente) {
      const id = el.typ + el.x;
      if (erledigt.has(id)) continue;
      if (el.typ === 'vz') {
        // nur die nächste Situation zählt: oben gefahren, wer kurz davor in der Luft war
        if (!vzNaechste) continue;
        vzNaechste = false;
        if (S.x < el.x - 4) S.yMax = 0;
        if (x0 < el.x && S.x >= el.x) {
          erledigt.add(id);
          const oben = S.yMax > 0.35, vz = el.richtigOben ? '> 0' : '< 0';
          const ort = { x: 230, y: 412, dauer: 1600 };     // unter der Straße, kurz
          if (oben === el.richtigOben) meldung(`✔ ${el.text}: W ${vz}`, '#3BA34B', ort);
          else zeitStrafe(`✘ ${el.text}: W ${vz}`, undefined, ort);
        }
        continue;
      }
      if (el.typ === 'lade') { if (x0 < el.x && S.x >= el.x) { erledigt.add(id); ladesaeule(); return; } continue; }
      if (el.typ === 'schotter') { if (!erledigt.has('an' + el.x) && S.x >= el.x - 10) { erledigt.add('an' + el.x); erledigt.add(id); schotterAnfahrt(el); return; } continue; }
      if (el.typ === 'kran') { if (x0 < el.x - 0.3 && S.x >= el.x - 0.3) { erledigt.add(id); kranHub(el); return; } continue; }
      if (el.typ === 'auffahrt') { if (S.x >= el.x - 24) { erledigt.add(id); auffahrtAnfahrt(el); return; } continue; }
      if (el.typ === 'gipfel') { if (x0 < el.x && S.x >= el.x) { erledigt.add(id); gipfel(el); return; } continue; }
      if (el.typ === 'gabel') { if (x0 < el.x && S.x >= el.x) { erledigt.add(id); gabelung(); return; } continue; }
      if (el.typ === 'kegel' || el.typ === 'ente' || el.typ === 'stein' || el.typ === 'bake') {
        // getroffen, wenn irgendein Teil des E-Scooters (Hinterrad bis Vorderrad) am Boden darüber ist
        if (S.y < 0.4 && el.x <= S.x && el.x >= S.x - LAENGE) { erledigt.add(id); zeitStrafe({ ente: 'Ente!', stein: 'Stein!', bake: 'Bake!' }[el.typ] || 'Hütchen!'); }
        else if (S.x - LAENGE > el.x) erledigt.add(id);
        continue;
      }
      if (el.typ === 'ampel' || el.typ === 'schranke' || el.typ === 'stopp') {
        if (el.typ === 'ampel' && !erledigt.has('an' + el.x) && S.x >= el.x - 24) { erledigt.add('an' + el.x); ampelAnfahrt(el); return; }
        if (el.typ === 'schranke' && !erledigt.has('an' + el.x) && S.x >= el.x - 3.6) { erledigt.add('an' + el.x); schrankeHalt(el); return; }
        if (S.x < el.x + FRAGE_ABSTAND - 4) S.yMax = 0;
        if (x0 < el.x + FRAGE_ABSTAND && S.x >= el.x + FRAGE_ABSTAND) { erledigt.add(id); torDurchfahren(el); }
        continue;
      }
      if (el.typ === 'ziel' && S.x >= el.x) { erledigt.add(id); S.fertig = true; spaeter(angekommen, 600); }
    }
  }
  // ---------------------------------------------------------- Ende
  function angekommen() {
    // verglichen wird die angezeigte Minute – „11:07“ zählt als 11:07
    const an = Math.floor(jetzt()), sterne = an <= L.sterne[0] ? 3 : an <= L.sterne[1] ? 2 : an <= L.sterne[2] ? 1 : 0;
    stand.fahrt.sterne[nr] = Math.max(stand.fahrt.sterne[nr], sterne);
    const code = sterne && LEVELCODE[nr + 1], letzte = nr === LEVEL.length - 1;
    const weiter = () => { document.onkeydown = document.onkeyup = null; (letzte ? urkundeZeigen : beweisfahrtStart)(); };
    if (sterne && nr + 1 < LEVEL.length) stand.fahrt.frei = Math.max(stand.fahrt.frei, nr + 2);
    const e = ebene(`<div class="mitte"><h2>${sterne ? `${L.ziel} erreicht – um ${uhr(an)} Uhr!` : `Zu spät – erst um ${uhr(an)} Uhr.`}</h2>
      <div style="font-size:2.6rem;color:#C9A000">${'★'.repeat(sterne)}${'☆'.repeat(3 - sterne)}</div>
      <p>★★★ bis ${uhr(L.sterne[0])} · ★★ bis ${uhr(L.sterne[1])} · ★ bis ${uhr(L.sterne[2])} Uhr</p>
      ${code ? `<p>Code für Level ${nr + 2}: <span class="code" style="color:#C9A000;border-color:#C9A000">${code}</span></p>` : ''}
      <div class="knoepfe"><button class="k hell" id="nochmal">🔄 Noch einmal</button>${sterne ? `<button class="k" id="weiter">${letzte ? '🏆 Zur Urkunde' : 'Weiter ➜'}</button>`
        : stand.fahrt.joker > 0 ? '<button class="k" id="joker" style="background:#C0392B">🟥 Stempel einlösen – das Gericht wartet</button>' : ''}</div></div>`, 560);
    e.querySelector('#nochmal').onclick = () => levelFahren(nr);
    // zu spät: Ein Stempel aus den Fällen rettet die Etappe – sie zählt als geschafft (★)
    if (e.querySelector('#joker')) e.querySelector('#joker').onclick = () => {
      stand.fahrt.joker--; stand.stempel = stand.fahrt.joker; kopfZeigen();
      stand.fahrt.sterne[nr] = Math.max(stand.fahrt.sterne[nr], 1);
      if (nr + 1 < LEVEL.length) stand.fahrt.frei = Math.max(stand.fahrt.frei, nr + 2);
      e.querySelector('.blatt').innerHTML = `<div class="mitte"><h2>Das Gericht wartet – ein Stempel weniger.</h2>
        <div style="font-size:2.6rem;color:#C9A000">★☆☆</div>
        ${LEVELCODE[nr + 1] ? `<p>Code für Level ${nr + 2}: <span class="code" style="color:#C9A000;border-color:#C9A000">${LEVELCODE[nr + 1]}</span></p>` : ''}
        <div class="knoepfe"><button class="k" id="weiter">${letzte ? '🏆 Zur Urkunde' : 'Weiter ➜'}</button></div></div>`;
      e.querySelector('#weiter').onclick = weiter;
    };
    if (sterne) e.querySelector('#weiter').onclick = weiter;
  }
  zeichne();
  // Anleitung kurz halten – „Losfahren“ muss ohne Scrollen zu sehen sein
  const e = ebene(`<div><h2 class="mitte" style="margin-bottom:2px">🛴 ${nr ? `Level ${nr + 1}: ${L.name}` : 'So fährst du'}</h2>
    <ul style="font-size:1.02rem;line-height:1.38;margin:4px 0;padding-left:22px">
      <li>Sei bis ${uhr(L.frist)} Uhr am ${L.ziel}${nr === LEVEL.length - 1 ? '' : ', dann schaffst du es bis 12 Uhr ins Gericht'}.</li>
      ${nr ? L.neu.map(t => `<li>${t}</li>`).join('') : `
      <li>Der E-Scooter fährt von selbst, der Regler stellt das Tempo ein. Mit <b>🛑 Bremse</b> hältst du an und machst Pause.</li>
      <li>Über die Hütchen springst du mit <b>⤒ Springen</b>.</li>
      <li>Fehler kosten Zeit.</li>`}</ul>
    <div class="knoepfe" style="margin-top:6px"><button class="k" id="losfahren">Losfahren ➜</button></div></div>`, 820);
  e.querySelector('#losfahren').onclick = () => { e.remove(); weiterFahren(); };
  requestAnimationFrame(tick);
}

startZeigen();
</script>
</body>
</html>
