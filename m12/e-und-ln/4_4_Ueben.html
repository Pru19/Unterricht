<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Üben</title>
<link rel="stylesheet" href="_Quellen/kurs.css?v=162ff1f3">
<script src="_Quellen/kurs-mathjax.js?v=162ff1f3"></script>
<script src="_Quellen/mathjax/tex-svg.js"></script>
<script src="_Quellen/mathlive/mathlive.min.js"></script>
</head>
<body>
<div class="huelle">
<!-- Kopf und Blättern setzt _Quellen/kurs.js aus seiner Seitenliste. -->
<main>

<p>Bearbeiten Sie die Aufgaben in Ihrem Heft. Bei Aufgabe 1 und 2 geben Sie die Ergebnisse ein;
   zu Aufgabe 3 und 4 vergleichen Sie mit der ausgelegten Lösung und haken die Aufgabe ab.</p>

<div id="aufgaben"></div>

</main>
</div>

<script src="_Quellen/kurs.js?v=162ff1f3"></script>
<script>
/* Aufgabe 1 aus dem Buch: nur Seite und Nummer, Ergebnis wird eingegeben
   (f(x) = x^2 - 1 auf [0; ∞[). Aufgabe 2 und 3 sind eigene Aufgaben, ihr Text
   steht hier; die Lösungen liegen aus (AB11 Lösungen zu den Übungen). */
Kurs.uebung(document.getElementById('aufgaben'), [
  { titel: 'Aufgabe 1', stufe: '●○○', stelle: 'Buch S. 156/12', art: 'ergebnis',
    hinweis: 'Rechnen Sie im Heft und geben Sie die Ergebnisse ein. Beim Antippen eines Felds öffnet sich eine Mathe-Tastatur: Wurzel und Hochzahl erscheinen mit einem Kästchen, mit dem Pfeil nach rechts geht es wieder heraus.',
    felder: [
      { gruppe: 'a)', frage: '\\( f^{-1}(x) = \\)', terme: ['√(x+1)', '√(1+x)', '(x+1)^(1/2)', '(x+1)^0.5', '(x+1)^0,5'] },
      { gruppe: 'b)', frage: '\\( (f^{-1})^{-1}(x) = \\)', terme: ['x^2-1', '-1+x^2'] },
      { gruppe: 'b)', frage: 'Beobachtung:', optionen: ['Man erhält wieder f.', 'Man erhält f⁻¹ noch einmal.', 'Man erhält −f.', 'Man erhält 1 : f.'], richtig: 'Man erhält wieder f.' },
      { gruppe: 'b)', frage: 'Begründung:', optionen: ['Zweimal an der Winkelhalbierenden spiegeln ergibt den Ausgangsgraphen.', 'Der Graph von f ist symmetrisch zur Winkelhalbierenden.', 'Der Graph von f ist eine Parabel.'], richtig: 'Zweimal an der Winkelhalbierenden spiegeln ergibt den Ausgangsgraphen.' }
    ] },
  { titel: 'Aufgabe 2', stufe: '●●○', stelle: 'Buch S. 166/5 a, S. 167/6 c, S. 166/7 f', art: 'ergebnis',
    hinweis: 'Bilden Sie die Ableitung im Heft und geben Sie sie ein.',
    felder: [
      { gruppe: '166/5 a)', frage: "\\( f'(x) = \\)", terme: ['7/(7x+5)', '7/(5+7x)'] },
      { gruppe: '167/6 c)', frage: "\\( f'(x) = \\)", terme: ['1'] },
      { gruppe: '166/7 f)', frage: "\\( f'(x) = \\)", terme: (function () {
          var a = ['cosxlnx', 'lnxcosx'], b = ['sinx/x', 'sinx1/x', '1/xsinx'], t = [];
          a.forEach(function (p) { b.forEach(function (q) { t.push(p + '+' + q, q + '+' + p); }); });
          return t; })() }
    ] },
  { titel: 'Aufgabe 3', stufe: '●●○', stelle: 'Umkehrbarkeit mit der Ableitung', art: 'auslage',
    text: 'a) Zeigen Sie, dass \\( f(x) = x^3 + 2x \\) auf \\( \\mathbb{R} \\) umkehrbar ist.<br>' +
          'b) Bestimmen Sie die Monotonieintervalle von \\( g(x) = x^3 - 12x \\), auf denen \\(g\\) umkehrbar ist.' },
  { titel: 'Aufgabe 4', stufe: '●●●', stelle: 'Umkehrfunktion einer e-Funktion', art: 'auslage', vertiefen: true,
    text: 'Bestimmen Sie den Term der Umkehrfunktion von \\( f(x) = e^x + 1 \\) und geben Sie ihre Definitionsmenge an.<br>' +
          '<span class="hinweis-klein">Tipp: \\( \\ln \\) ist die Umkehrfunktion von \\( e^x \\). Aus \\( e^y = a \\) folgt \\( y = \\ln(a) \\).</span>' }
]);
</script>
</body>
</html>
